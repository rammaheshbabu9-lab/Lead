<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>ONE MINUTE NEWS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f8;
  color:#111;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  width:100%;
  height:58px;
  background:#fff;
  border-bottom:1px solid #e5e5e5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
}

.menu-btn,
.profile-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#f2f3f5;
  font-size:20px;
}

.logo{
  text-align:center;
  font-size:18px;
  font-weight:900;
  letter-spacing:-.5px;
}

.logo span{
  display:block;
  color:#777;
  font-size:9px;
  letter-spacing:1px;
  margin-top:2px;
}

/* LOCATION LANGUAGE */

.topbar{
  width:100%;
  background:#fff;
  padding:8px 10px;
  display:flex;
  gap:8px;
  border-bottom:1px solid #eee;
}

.top-option{
  flex:1;
  min-width:0;
  height:34px;
  border:1px solid #ddd;
  border-radius:18px;
  background:#fff;
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* FEED */

#feed{
  width:100%;
  max-width:100%;
  padding:8px 8px 82px;
}

/* NEWS */

.news-card{
  width:100%;
  max-width:100%;
  background:#fff;
  border-radius:12px;
  margin-bottom:12px;
  overflow:hidden;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.news-image{
  display:block;
  width:100%;
  height:250px;
  object-fit:cover;
  background:#ddd;
}

.news-content{
  width:100%;
  padding:11px;
  overflow:hidden;
}

.news-meta{
  display:flex;
  align-items:center;
  gap:6px;
  margin-bottom:6px;
  color:#777;
  font-size:10px;
  overflow:hidden;
}

.news-category{
  color:#e11;
  font-weight:700;
}

.news-title{
  font-size:18px;
  line-height:1.3;
  font-weight:800;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.news-matter{
  margin-top:7px;
  color:#555;
  font-size:13px;
  line-height:1.45;
  overflow-wrap:anywhere;
  word-break:break-word;
}

/* ACTIONS */

.actions{
  width:100%;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
  padding:8px 10px 10px;
  overflow:hidden;
}

.action{
  width:100%;
  min-width:0;
  height:36px;
  border:0;
  border-radius:18px;
  background:#f3f4f6;
  color:#333;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 3px;
  font-size:11px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.action.liked{
  background:#fff0f0;
  color:#e53935;
}

.action.saved{
  background:#eef4ff;
  color:#155eef;
}

/* REELS */

.reels-container{
  width:100%;
  padding:0 0 80px;
}

.reel-card{
  width:100%;
  max-width:100%;
  margin:0 0 12px;
  background:#000;
  overflow:hidden;
}

.reel-card video{
  display:block;
  width:100%;
  height:calc(100vh - 115px);
  min-height:520px;
  max-height:780px;
  object-fit:cover;
  background:#000;
}

.reel-info{
  width:100%;
  padding:12px;
  background:#fff;
}

.reel-title{
  font-size:17px;
  line-height:1.3;
  font-weight:800;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.reel-matter{
  margin-top:6px;
  color:#555;
  font-size:13px;
  line-height:1.45;
}

.reel-location{
  margin-top:7px;
  color:#777;
  font-size:11px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:1500;
  width:100%;
  height:64px;
  background:#fff;
  border-top:1px solid #ddd;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-btn{
  border:0;
  background:#fff;
  color:#777;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:10px;
}

.nav-btn .icon{
  font-size:19px;
}

.nav-btn.active{
  color:#111;
  font-weight:700;
}

/* DRAWER */

.drawer-bg{
  position:fixed;
  inset:0;
  z-index:3000;
  background:rgba(0,0,0,.45);
  display:none;
}

.drawer{
  width:285px;
  max-width:85%;
  height:100%;
  background:#fff;
  padding:20px 14px;
}

.drawer-title{
  font-size:21px;
  font-weight:900;
  margin-bottom:25px;
}

.drawer-item{
  width:100%;
  height:45px;
  border:0;
  background:#fff;
  border-radius:9px;
  text-align:left;
  padding:0 12px;
  font-size:14px;
}

.drawer-item:hover{
  background:#f3f3f3;
}

/* MODALS */

.modal-bg{
  position:fixed;
  inset:0;
  z-index:2500;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal{
  width:100%;
  max-width:520px;
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:18px 18px 0 0;
  padding:18px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.modal-head h2{
  font-size:20px;
}

.close{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#f1f1f1;
  font-size:18px;
}

.field{
  margin-bottom:11px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:5px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid #ddd;
  border-radius:9px;
  padding:11px;
  font-size:14px;
  outline:none;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.primary{
  width:100%;
  height:44px;
  border:0;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-size:14px;
  font-weight:700;
}

.secondary{
  width:100%;
  height:42px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  font-weight:600;
  margin-top:8px;
}

/* PROFILE */

.profile-box{
  text-align:center;
  padding-bottom:15px;
}

.avatar{
  width:75px;
  height:75px;
  border-radius:50%;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 10px;
  font-size:28px;
  font-weight:800;
}

.profile-name{
  font-size:20px;
  font-weight:800;
}

.profile-email{
  color:#777;
  font-size:12px;
  margin-top:4px;
}

.profile-info{
  background:#f6f6f6;
  border-radius:10px;
  padding:10px;
  margin:12px 0;
  font-size:13px;
  line-height:1.7;
  text-align:left;
}

.profile-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.profile-action{
  height:45px;
  border:0;
  border-radius:9px;
  background:#f1f2f4;
  font-weight:700;
}

.profile-action.full{
  grid-column:1/-1;
}

/* COMMENTS */

.comment-item{
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.comment-user{
  font-size:12px;
  font-weight:800;
}

.comment-text{
  margin-top:4px;
  color:#444;
  font-size:13px;
}

.comment-form{
  display:flex;
  gap:7px;
  margin-top:12px;
}

.comment-form input{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:20px;
  padding:10px 13px;
}

.comment-form button{
  width:70px;
  border:0;
  border-radius:20px;
  background:#111;
  color:#fff;
}

/* SEARCH */

.search-box{
  display:flex;
  gap:8px;
}

.search-box input{
  flex:1;
  min-width:0;
}

.search-result{
  padding:11px 0;
  border-bottom:1px solid #eee;
}

/* COMMON */

.empty{
  text-align:center;
  padding:50px 20px;
  color:#777;
  font-size:14px;
}

.loading{
  text-align:center;
  padding:40px;
  color:#777;
}

.toast{
  position:fixed;
  left:50%;
  bottom:78px;
  transform:translateX(-50%);
  z-index:5000;
  display:none;
  max-width:90%;
  padding:10px 15px;
  border-radius:22px;
  background:#111;
  color:#fff;
  font-size:12px;
  text-align:center;
}

/* SMALL MOBILE */

@media(max-width:380px){

  .news-image{
    height:225px;
  }

  .actions{
    gap:4px;
    padding-left:7px;
    padding-right:7px;
  }

  .action{
    height:34px;
    font-size:10px;
    padding:0 2px;
  }

  .reel-card video{
    height:calc(100vh - 110px);
    min-height:480px;
  }
}

/* TABLET */

@media(min-width:600px){

  #feed{
    max-width:700px;
    margin:auto;
  }

  .news-card{
    max-width:680px;
    margin-left:auto;
    margin-right:auto;
  }

  .reel-card{
    max-width:700px;
    margin-left:auto;
    margin-right:auto;
  }

  .reel-card video{
    height:760px;
    max-height:760px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->

<header class="header">

  <button class="menu-btn" onclick="openDrawer()">☰</button>

  <div class="logo">
    ONE MINUTE NEWS
    <span>FAST • SHORT • LOCAL</span>
  </div>

  <button class="profile-btn" onclick="openProfile()">👤</button>

</header>


<!-- LOCATION / LANGUAGE -->

<div class="topbar">

  <button class="top-option" onclick="openLocation()">
    📍 <span id="locationText">India</span>
  </button>

  <button class="top-option" onclick="openLanguage()">
    🌐 <span id="languageText">English</span>
  </button>

</div>


<!-- MAIN -->

<main id="feed">
  <div class="loading">Loading news...</div>
</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button
    class="nav-btn active"
    id="navHome"
    onclick="showHome()">

    <span class="icon">⌂</span>
    Home

  </button>

  <button
    class="nav-btn"
    id="navSearch"
    onclick="openSearch()">

    <span class="icon">⌕</span>
    Search

  </button>

  <button
    class="nav-btn"
    id="navReels"
    onclick="showReels()">

    <span class="icon">▶</span>
    Reels

  </button>

  <button
    class="nav-btn"
    id="navSaved"
    onclick="showSaved()">

    <span class="icon">🔖</span>
    Saved

  </button>

  <button
    class="nav-btn"
    id="navProfile"
    onclick="openProfile()">

    <span class="icon">👤</span>
    Profile

  </button>

</nav>


<!-- DRAWER -->

<div
  class="drawer-bg"
  id="drawerBg"
  onclick="closeDrawer()">

  <div
    class="drawer"
    onclick="event.stopPropagation()">

    <div class="drawer-title">
      ONE MINUTE NEWS
    </div>

    <button
      class="drawer-item"
      onclick="showHome();closeDrawer()">
      🏠 Home
    </button>

    <button
      class="drawer-item"
      onclick="showReels();closeDrawer()">
      ▶ Reels
    </button>

    <button
      class="drawer-item"
      onclick="showSaved();closeDrawer()">
      🔖 Saved
    </button>

    <button
      class="drawer-item"
      onclick="openProfile();closeDrawer()">
      👤 Profile
    </button>

    <button
      class="drawer-item"
      onclick="openSearch();closeDrawer()">
      🔍 Search
    </button>

    <button
      class="drawer-item"
      onclick="openAbout();closeDrawer()">
      ℹ️ About
    </button>

  </div>

</div>


<!-- LOGIN -->

<div class="modal-bg" id="loginModal">

  <div class="modal">

    <div class="modal-head">

      <h2>Login / Sign Up</h2>

      <button
        class="close"
        onclick="closeModal('loginModal')">
        ×
      </button>

    </div>

    <div class="field">
      <label>Name</label>
      <input
        id="loginName"
        placeholder="Enter your name">
    </div>

    <div class="field">
      <label>Email</label>
      <input
        id="loginEmail"
        type="email"
        placeholder="Enter email">
    </div>

    <div class="field">
      <label>Password</label>
      <input
        id="loginPassword"
        type="password"
        placeholder="Enter password">
    </div>

    <button
      class="primary"
      onclick="demoLogin()">
      Continue
    </button>

    <p style="
      font-size:11px;
      color:#777;
      text-align:center;
      margin-top:10px">
      Demo login — no email verification required.
    </p>

  </div>

</div>


<!-- PROFILE -->

<div class="modal-bg" id="profileModal">

  <div class="modal">

    <div class="modal-head">

      <h2>Profile</h2>

      <button
        class="close"
        onclick="closeModal('profileModal')">
        ×
      </button>

    </div>

    <div id="profileContent"></div>

  </div>

</div>


<!-- UPLOAD NEWS -->

<div class="modal-bg" id="uploadNewsModal">

  <div class="modal">

    <div class="modal-head">

      <h2>Upload News</h2>

      <button
        class="close"
        onclick="closeModal('uploadNewsModal')">
        ×
      </button>

    </div>

    <div class="field">
      <label>Headline</label>

      <input
        id="newsHeadline"
        placeholder="Enter headline">
    </div>

    <div class="field">

      <label>News Matter</label>

      <textarea
        id="newsMatter"
        placeholder="Enter news details"></textarea>

    </div>

    <div class="field">

      <label>Category</label>

      <select id="newsCategory">

        <option>General</option>
        <option>Andhra Pradesh</option>
        <option>Telangana</option>
        <option>India</option>
        <option>World</option>
        <option>Politics</option>
        <option>Business</option>
        <option>Sports</option>
        <option>Technology</option>
        <option>Entertainment</option>
        <option>Education</option>

      </select>

    </div>

    <div class="field">

      <label>Location</label>

      <select id="newsLocation"></select>

    </div>

    <div class="field">

      <label>Language</label>

      <select id="newsLanguage"></select>

    </div>

    <div class="field">

      <label>Upload Image</label>

      <input
        id="newsImage"
        type="file"
        accept="image/*">

    </div>

    <button
      class="primary"
      onclick="uploadNews()">
      Upload News
    </button>

  </div>

</div>


<!-- UPLOAD REEL -->

<div class="modal-bg" id="uploadReelModal">

  <div class="modal">

    <div class="modal-head">

      <h2>Upload Reel</h2>

      <button
        class="close"
        onclick="closeModal('uploadReelModal')">
        ×
      </button>

    </div>

    <div class="field">

      <label>Reel Title</label>

      <input
        id="reelTitle"
        placeholder="Enter reel title">

    </div>

    <div class="field">

      <label>Reel Matter</label>

      <textarea
        id="reelMatter"
        placeholder="Enter reel description"></textarea>

    </div>

    <div class="field">

      <label>Location</label>

      <select id="reelLocation"></select>

    </div>

    <!-- DIRECT VIDEO UPLOAD -->

    <div class="field">

      <label>Upload Video</label>

      <input
        id="reelVideoFile"
        type="file"
        accept="video/*">

    </div>

    <button
      class="primary"
      onclick="uploadReel()">
      Upload Reel
    </button>

  </div>

</div>


<!-- COMMENTS -->

<div class="modal-bg" id="commentsModal">

  <div class="modal">

    <div class="modal-head">

      <h2>Comments</h2>

      <button
        class="close"
        onclick="closeModal('commentsModal')">
        ×
      </button>

    </div>

    <div id="commentsList"></div>

    <div class="comment-form">

      <input
        id="commentInput"
        placeholder="Write a comment...">

      <button onclick="postComment()">
        Post
      </button>

    </div>

  </div>

</div>


<!-- LOCATION -->

<div class="modal-bg" id="locationModal">

  <div class="modal">

    <div class="modal-head">

      <h2>Select Location</h2>

      <button
        class="close"
        onclick="closeModal('locationModal')">
        ×
      </button>

    </div>

    <div class="field">
      <select id="locationSelect"></select>
    </div>

    <button
      class="primary"
      onclick="saveLocation()">
      Save
    </button>

  </div>

</div>


<!-- LANGUAGE -->

<div class="modal-bg" id="languageModal">

  <div class="modal">

    <div class="modal-head">

      <h2>Select Language</h2>

      <button
        class="close"
        onclick="closeModal('languageModal')">
        ×
      </button>

    </div>

    <div class="field">
      <select id="languageSelect"></select>
    </div>

    <button
      class="primary"
      onclick="saveLanguage()">
      Save
    </button>

  </div>

</div>


<!-- SEARCH -->

<div class="modal-bg" id="searchModal">

  <div class="modal">

    <div class="modal-head">

      <h2>Search News</h2>

      <button
        class="close"
        onclick="closeModal('searchModal')">
        ×
      </button>

    </div>

    <div class="search-box">

      <input
        id="searchInput"
        placeholder="Search news...">

      <button
        class="primary"
        style="width:75px;margin:0"
        onclick="doSearch()">
        Search
      </button>

    </div>

    <div
      id="searchResults"
      style="margin-top:12px">
    </div>

  </div>

</div>


<!-- ABOUT -->

<div class="modal-bg" id="aboutModal">

  <div class="modal">

    <div class="modal-head">

      <h2>About</h2>

      <button
        class="close"
        onclick="closeModal('aboutModal')">
        ×
      </button>

    </div>

    <p style="
      line-height:1.6;
      font-size:14px">
      ONE MINUTE NEWS gives short and fast news
      updates from India.
    </p>

  </div>

</div>


<div class="toast" id="toast"></div>

/* ================================

/* ================================
   HELPERS
================================ */

function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent = message;
  el.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(() => {

      el.style.display = "none";

    },2500);
}


function openModal(id){

  document.getElementById(id)
    .style.display = "flex";

}


function closeModal(id){

  document.getElementById(id)
    .style.display = "none";

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHtml(value);

}


/* ================================
   LOCATIONS
================================ */

function fillLocations(){

  const selects = [

    document.getElementById("locationSelect"),

    document.getElementById("newsLocation"),

    document.getElementById("reelLocation")

  ];

  selects.forEach(select => {

    if(!select) return;

    select.innerHTML = "";

    states.forEach(item => {

      const option =
        document.createElement("option");

      option.value = item;
      option.textContent = item;

      if(item === selectedLocation){
        option.selected = true;
      }

      select.appendChild(option);

    });

  });

}

/* ================================
   LOAD NEWS
================================ */

async function loadNews(){

  const feed =
    document.getElementById("feed");

  feed.innerHTML =
    '<div class="loading">Loading news...</div>';

  const {data,error} =
    await sb
      .from("news")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );

  if(error){

    console.error(error);

    feed.innerHTML =
      '<div class="empty">Unable to load news.</div>';

    return;
  }

  const now = Date.now();

  allNews =
    (data || []).filter(item => {

      if(!item.created_at)
        return true;

      return (
        now -
        new Date(item.created_at).getTime()
        <=
        24 * 60 * 60 * 1000
      );

    });

  renderNews(allNews);

}


/* ================================
   RENDER NEWS
================================ */

function renderNews(list){

  const feed =
    document.getElementById("feed");

  feed.innerHTML = "";

  if(!list.length){

    feed.innerHTML =
      '<div class="empty">No news available.</div>';

    return;
  }

  list.forEach(item => {

    const card =
      document.createElement("article");

    card.className = "news-card";

    const id =
      String(item.id);

    const isLiked =
      liked.includes(id);

    const isSaved =
      saved.includes(id);

    card.innerHTML = `

      ${
        item.image_url
        ?
        `
        <img
          class="news-image"
          src="${escapeAttr(item.image_url)}"
          alt="News"
          onerror="this.style.display='none'">
        `
        :
        ""
      }

      <div class="news-content">

        <div class="news-meta">

          <span class="news-category">
            ${escapeHtml(
              item.category || "General"
            )}
          </span>

          <span>•</span>

          <span>
            ${escapeHtml(
              item.location || "India"
            )}
          </span>

          <span>•</span>

          <span>
            ${escapeHtml(
              item.language || "English"
            )}
          </span>

        </div>

        <div class="news-title">
          ${escapeHtml(
            item.title ||
            item.headline ||
            ""
          )}
        </div>

        ${
          item.matter
          ?
          `
          <div class="news-matter">
            ${escapeHtml(item.matter)}
          </div>
          `
          :
          ""
        }

      </div>

      <div class="actions">

        <button
          class="action ${isLiked ? "liked" : ""}"
          onclick="toggleLike('${id}',this)">
          ${isLiked ? "❤️ Liked" : "♡ Like"}
        </button>

        <button
          class="action"
          onclick="openComments('${id}')">
          💬 Comment
        </button>

        <button
          class="action"
          onclick="shareNews('${id}')">
          ↗ Share
        </button>

        <button
          class="action ${isSaved ? "saved" : ""}"
          onclick="toggleSave('${id}',this)">
          ${isSaved ? "🔖 Saved" : "🔖 Save"}
        </button>

      </div>
    `;

    feed.appendChild(card);

  });

}


/* ================================
   LIKE
================================ */

async function toggleLike(id,button){

  id = String(id);

  if(!currentUser){

    openLogin();

    return;
  }

  const index =
    liked.indexOf(id);

  if(index >= 0){

    liked.splice(index,1);

    button.classList.remove("liked");

    button.textContent =
      "♡ Like";

  }else{

    liked.push(id);

    button.classList.add("liked");

    button.textContent =
      "❤️ Liked";

    try{

      await sb
        .from("news_likes")
        .insert({
          news_id:id
        });

    }catch(error){

      console.log(error);

    }

  }

  localStorage.setItem(
    "oneMinuteLiked",
    JSON.stringify(liked)
  );

}


/* ================================
   SAVE
================================ */

function toggleSave(id,button){

  id = String(id);

  if(!currentUser){

    openLogin();

    return;
  }

  const index =
    saved.indexOf(id);

  if(index >= 0){

    saved.splice(index,1);

    button.classList.remove("saved");

    button.textContent =
      "🔖 Save";

  }else{

    saved.push(id);

    button.classList.add("saved");

    button.textContent =
      "🔖 Saved";

    toast("News saved");

  }

  localStorage.setItem(
    "oneMinuteSaved",
    JSON.stringify(saved)
  );

}


/* ================================
   SHARE
================================ */

async function shareNews(id){

  const item =
    allNews.find(
      x => String(x.id) === String(id)
    );

  if(!item) return;

  const title =
    item.title ||
    item.headline ||
    "ONE MINUTE NEWS";

  try{

    if(navigator.share){

      await navigator.share({

        title:"ONE MINUTE NEWS",

        text:title,

        url:location.href

      });

    }else{

      await navigator.clipboard.writeText(
        title + "\n" + location.href
      );

      toast("News link copied");

    }

  }catch(error){

    console.log(error);

  }

}


/* ================================
   COMMENTS
================================ */

async function openComments(id){

  if(!currentUser){

    openLogin();

    return;
  }

  currentCommentNewsId = id;

  openModal("commentsModal");

  const list =
    document.getElementById(
      "commentsList"
    );

  list.innerHTML =
    '<div class="loading">Loading comments...</div>';

  const {data,error} =
    await sb
      .from("news_comments")
      .select("*")
      .eq("news_id",id)
      .order(
        "created_at",
        {ascending:true}
      );

  let comments =
    data || [];

  if(error){

    comments =
      localComments[id] || [];

  }

  if(!comments.length){

    list.innerHTML =
      '<div class="empty" style="padding:20px">No comments yet.</div>';

    return;
  }

  list.innerHTML = "";

  comments.forEach(comment => {

    const div =
      document.createElement("div");

    div.className =
      "comment-item";

    div.innerHTML = `

      <div class="comment-user">
        ${escapeHtml(
          comment.name || "User"
        )}
      </div>

      <div class="comment-text">
        ${escapeHtml(
          comment.comment || ""
        )}
      </div>

    `;

    list.appendChild(div);

  });

}


async function postComment(){

  if(!currentUser){

    openLogin();

    return;
  }

  const input =
    document.getElementById(
      "commentInput"
    );

  const text =
    input.value.trim();

  if(!text){

    toast("Write a comment");

    return;
  }

  const {error} =
    await sb
      .from("news_comments")
      .insert({

        news_id:currentCommentNewsId,

        name:currentUser.name,

        comment:text

      });

  if(error){

    console.log(error);

    if(!localComments[currentCommentNewsId]){
      localComments[currentCommentNewsId] = [];
    }

    localComments[
      currentCommentNewsId
    ].push({

      name:currentUser.name,

      comment:text

    });

    localStorage.setItem(
      "oneMinuteComments",
      JSON.stringify(localComments)
    );

  }

  input.value = "";

  toast("Comment posted");

  openComments(currentCommentNewsId);

}

  closeModal("profileModal");

  fillLocations();
  fillLanguages();

  openModal("uploadNewsModal");

}


async function uploadNews(){

  if(!currentUser){

    openLogin();

    return;
  }

  const headline =
    document
      .getElementById("newsHeadline")
      .value
      .trim();

  const matter =
    document
      .getElementById("newsMatter")
      .value
      .trim();

  const category =
    document
      .getElementById("newsCategory")
      .value;

  const location =
    document
      .getElementById("newsLocation")
      .value;

  const language =
    document
      .getElementById("newsLanguage")
      .value;

  const imageFile =
    document
      .getElementById("newsImage")
      .files[0];

  if(!headline){

    toast("Enter headline");

    return;
  }

  try{

    let image_url = null;

    if(imageFile){

      const safeName =
        imageFile.name.replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );

      const fileName =
        "news/" +
        Date.now() +
        "_" +
        safeName;

      const upload =
        await sb.storage
          .from("news-media")
          .upload(
            fileName,
            imageFile,
            {
              upsert:false,
              contentType:imageFile.type
            }
          );

      if(upload.error){

        throw upload.error;
      }

      const publicUrl =
        sb.storage
          .from("news-media")
          .getPublicUrl(fileName);

      image_url =
        publicUrl.data.publicUrl;

    }

    const row = {

      title:headline,

      headline:headline,

      matter:matter || null,

      category:category || "General",

      language:language || "English",

      location:location || "India",

      image_url:image_url,

      created_at:
        new Date().toISOString()

    };

    const {error} =
      await sb
        .from("news")
        .insert(row)
        .select()
        .single();

    if(error){

      throw error;
    }

    document.getElementById(
      "newsHeadline"
    ).value = "";

    document.getElementById(
      "newsMatter"
    ).value = "";

    document.getElementById(
      "newsImage"
    ).value = "";

    closeModal("uploadNewsModal");

    toast(
      "News uploaded successfully"
    );

    await loadNews();

  }catch(error){

    console.error(
      "NEWS UPLOAD ERROR:",
      error
    );

    toast(
      "News upload failed: " +
      (error.message || "Unknown error")
    );

  }

}

async function uploadReel(){

  if(!currentUser){

    openLogin();

    return;
  }

  const title =
    document
      .getElementById("reelTitle")
      .value
      .trim();

  const matter =
    document
      .getElementById("reelMatter")
      .value
      .trim();

  const location =
    document
      .getElementById("reelLocation")
      .value;

  const videoFile =
    document
      .getElementById("reelVideoFile")
      .files[0];

  if(!title){

    toast("Enter reel title");

    return;
  }

  if(!videoFile){

    toast("Please select a video");

    return;
  }

  try{

    toast("Uploading video...");

    const safeName =
      videoFile.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );

    const fileName =
      "reels/" +
      Date.now() +
      "_" +
      safeName;

    const upload =
      await sb.storage
        .from("news-media")
        .upload(
          fileName,
          videoFile,
          {
            upsert:false,
            contentType:videoFile.type
          }
        );

    if(upload.error){

      throw upload.error;
    }

    const publicUrl =
      sb.storage
        .from("news-media")
        .getPublicUrl(fileName);

    const video_url =
      publicUrl.data.publicUrl;

    const {error} =
      await sb
        .from("reels")
        .insert({

          title:title,

          matter:matter || null,

          category:"General",

          location:location || "India",

          video_url:video_url,

          created_at:
            new Date().toISOString()

        })
        .select()
        .single();

    if(error){

      throw error;
    }

    document.getElementById(
      "reelTitle"
    ).value = "";

    document.getElementById(
      "reelMatter"
    ).value = "";

    document.getElementById(
      "reelVideoFile"
    ).value = "";

    closeModal("uploadReelModal");

    toast(
      "Reel uploaded successfully"
    );

  }catch(error){

    console.error(
      "REEL UPLOAD ERROR:",
      error
    );

    toast(
      "Reels upload failed: " +
      (error.message || "Unknown error")
    );

  }

}


/* ================================
   REELS SCREEN
================================ */

async function showReels(){

  setActiveNav("navReels");

  const feed =
    document.getElementById("feed");

  feed.innerHTML =
    '<div class="loading">Loading reels...</div>';

  const {data,error} =
    await sb
      .from("reels")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );

  if(error){

    console.error(error);

    feed.innerHTML =
      '<div class="empty">Unable to load reels.</div>';

    return;
  }

  const now = Date.now();

  allReels =
    (data || []).filter(item => {

      if(!item.created_at)
        return true;

      return (
        now -
        new Date(item.created_at).getTime()
        <=
        24*60*60*1000
      );

    });

  renderReels(allReels);

}


function renderReels(list){

  const feed =
    document.getElementById("feed");

  feed.innerHTML = "";

  if(!list.length){

    feed.innerHTML =
      '<div class="empty">No reels available.</div>';

    return;
  }

  const container =
    document.createElement("div");

  container.className =
    "reels-container";

  list.forEach(item => {

    const card =
      document.createElement("div");

    card.className =
      "reel-card";

    card.innerHTML = `

      <video
        src="${escapeAttr(item.video_url)}"
        controls
        playsinline
        loop
        preload="metadata">
      </video>

      <div class="reel-info">

        <div class="reel-title">
          ${escapeHtml(
            item.title || ""
          )}
        </div>

        ${
          item.matter
          ?
          `
          <div class="reel-matter">
            ${escapeHtml(
              item.matter
            )}
          </div>
          `
          :
          ""
        }

        <div class="reel-location">
          📍 ${escapeHtml(
            item.location || "India"
          )}
        </div>

      </div>
    `;

    container.appendChild(card);

  });

  feed.appendChild(container);

}

function setActiveNav(id){

  document
    .querySelectorAll(".nav-btn")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  const button =
    document.getElementById(id);

  if(button){
    button.classList.add("active");
  }

}


/* ================================
   SEARCH
================================ */

function openSearch(){

  openModal("searchModal");

  setTimeout(() => {

    document
      .getElementById("searchInput")
      .focus();

  },100);

}


function doSearch(){

  const query =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const result =
    document.getElementById(
      "searchResults"
    );

  if(!query){

    result.innerHTML =
      '<div class="empty" style="padding:20px">Enter search text.</div>';

    return;
  }

  const matches =
    allNews.filter(item => {

      const text = [

        item.title,
        item.headline,
        item.matter,
        item.category,
        item.location,
        item.language

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

      return text.includes(query);

    });

  if(!matches.length){

    result.innerHTML =
      '<div class="empty" style="padding:20px">No results found.</div>';

    return;
  }

  result.innerHTML = "";

  matches.forEach(item => {

    const div =
      document.createElement("div");

    div.className =
      "search-result";

    div.innerHTML = `

      <b>
        ${escapeHtml(
          item.title ||
          item.headline ||
          ""
        )}
      </b>

      <div style="
        color:#777;
        font-size:11px;
        margin-top:4px">
        ${escapeHtml(
          item.location || "India"
        )}
      </div>

    `;

    div.onclick = () => {

      closeModal("searchModal");

      renderNews([item]);

    };

    result.appendChild(div);

  });

}
