<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a66c2">
<title>WorkLynk — People • Skills • Opportunities</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --blue:#0a66c2;
 --blue2:#004182;
 --bg:#f3f6f8;
 --card:#fff;
 --text:#172033;
 --muted:#667085;
 --line:#e4e7ec;
 --green:#16a34a;
 --danger:#dc2626;
 --gold:#b7791f;
 --shadow:0 3px 16px rgba(16,24,40,.08);
 --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
 background:var(--bg);color:var(--text)
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.bold{font-weight:800}

.btn{
 border:0;background:var(--blue);color:#fff;
 padding:10px 15px;border-radius:10px;font-weight:800
}
.btn:hover{background:var(--blue2)}
.btn.gray{background:#eef2f6;color:#344054}
.btn.outline{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.danger{background:var(--danger)}
.btn.green{background:var(--green)}

.iconbtn{
 border:0;background:transparent;border-radius:10px;
 padding:9px;font-size:19px
}
.iconbtn:hover{background:#eef2f6}

.top{
 position:sticky;top:0;z-index:50;
 height:64px;background:#fff;
 border-bottom:1px solid var(--line)
}
.topin{
 width:min(1250px,calc(100% - 24px));
 height:100%;margin:auto;
 display:flex;align-items:center;gap:12px
}
.logo{
 font-size:24px;font-weight:950;color:var(--blue);
 white-space:nowrap
}
.logo span{color:#111}

.search{
 width:100%;max-width:450px;
 background:#eef2f6;border:0;border-radius:11px;
 padding:11px 14px;outline:none
}
.search:focus{box-shadow:0 0 0 2px #b9d8f5}

.topactions{
 margin-left:auto;display:flex;align-items:center;gap:4px
}
.avatar{
 width:39px;height:39px;border-radius:50%;
 display:grid;place-items:center;
 background:#dbeafe;color:var(--blue);
 font-weight:900;overflow:hidden;
 border:1px solid #d0d5dd;
 flex:none
}
.avatar img{width:100%;height:100%;object-fit:cover}

.layout{
 width:min(1250px,calc(100% - 24px));
 margin:18px auto 80px;
 display:grid;
 grid-template-columns:220px minmax(0,1fr) 280px;
 gap:18px
}
.side,.right,.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:var(--radius);
 box-shadow:var(--shadow)
}
.side{
 padding:10px;height:max-content;
 position:sticky;top:82px
}
.right{
 padding:16px;height:max-content;
 position:sticky;top:82px
}
.nav{
 width:100%;border:0;background:transparent;
 text-align:left;padding:12px;
 border-radius:10px;
 color:#344054;font-weight:800;
 display:flex;gap:10px;align-items:center
}
.nav:hover,.nav.active{
 background:#e8f1fb;color:var(--blue)
}

.card{
 padding:16px;margin-bottom:14px
}
.hero{
 border:0;color:#fff;
 background:linear-gradient(135deg,#0a66c2,#004182 65%,#172554)
}
.hero h1{font-size:31px;margin-bottom:8px}
.hero p{line-height:1.55;opacity:.92}
.heroActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}

.composer{
 display:flex;align-items:center;gap:10px
}
.composerInput{
 flex:1;border:1px solid var(--line);
 border-radius:30px;padding:12px 16px;
 cursor:pointer;outline:none
}

.sectiontitle{
 display:flex;align-items:center;
 justify-content:space-between;gap:10px;
 margin-bottom:12px
}
.sectiontitle h2{font-size:22px}

.posthead{
 display:flex;align-items:center;gap:10px
}
.grow{flex:1}
.postcaption{
 margin:12px 0;line-height:1.55;
 white-space:pre-wrap
}
.postmedia{
 width:100%;max-height:550px;
 object-fit:cover;border-radius:13px
}
.postactions{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:3px;border-top:1px solid var(--line);
 margin-top:12px;padding-top:6px
}
.postactions button{
 border:0;background:#fff;
 padding:10px 5px;border-radius:9px;
 color:#475467;font-weight:800
}
.postactions button:hover{background:#f2f4f7}
.postactions button.active{color:var(--blue)}

.commentBox{
 display:flex;gap:7px;margin-top:10px
}
.commentBox input{
 flex:1;border:1px solid var(--line);
 border-radius:20px;padding:9px 12px;outline:none
}
.comment{
 padding:8px 0;
 border-bottom:1px solid #f0f2f5
}

.stats{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:10px
}
.stat{
 background:#f8fafc;border:1px solid var(--line);
 border-radius:12px;padding:14px;text-align:center
}
.stat b{font-size:22px;display:block}

.grid2{
 display:grid;grid-template-columns:repeat(2,1fr);gap:14px
}

.listitem{
 border:1px solid var(--line);
 border-radius:12px;padding:14px;margin-bottom:10px
}
.listitem:last-child{margin-bottom:0}

.chips{
 display:flex;flex-wrap:wrap;gap:6px;margin-top:8px
}
.chip{
 padding:5px 9px;border-radius:999px;
 background:#eef4fb;color:#245b91;
 font-size:12px;font-weight:800
}

.progress{
 height:8px;background:#e5e7eb;
 border-radius:99px;overflow:hidden
}
.progress i{
 display:block;height:100%;
 background:var(--blue)
}

.profileCover{
 height:145px;
 border-radius:14px 14px 0 0;
 background:linear-gradient(120deg,#0a66c2,#4f46e5,#7c3aed)
}
.profileMain{
 margin-top:-48px;padding:0 20px 20px
}
.bigAvatar{
 width:96px;height:96px;border-radius:50%;
 border:4px solid #fff;
 background:#dbeafe;
 object-fit:cover
}

.tabs{
 display:flex;gap:5px;overflow:auto;
 border-bottom:1px solid var(--line);
 margin-bottom:14px
}
.tab{
 border:0;background:#fff;
 padding:10px 14px;font-weight:800;
 white-space:nowrap
}
.tab.active{
 color:var(--blue);
 border-bottom:3px solid var(--blue)
}

.modalback{
 position:fixed;inset:0;
 background:rgba(15,23,42,.62);
 z-index:100;
 display:grid;place-items:center;
 padding:15px
}
.modal{
 width:min(650px,100%);
 max-height:91vh;overflow:auto;
 background:#fff;border-radius:18px;
 box-shadow:0 25px 80px rgba(0,0,0,.28)
}
.modalHead{
 padding:16px 18px;border-bottom:1px solid var(--line);
 display:flex;align-items:center;justify-content:space-between
}
.modalBody{padding:18px}
.modalFoot{
 padding:14px 18px;border-top:1px solid var(--line);
 display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap
}
.field{margin-bottom:13px}
.field label{
 display:block;font-size:13px;
 font-weight:800;margin-bottom:6px
}
.field input,.field textarea,.field select{
 width:100%;padding:11px 12px;
 border:1px solid #d0d5dd;border-radius:10px;
 outline:none;background:#fff
}
.field textarea{min-height:110px;resize:vertical}

.toast{
 position:fixed;right:18px;bottom:18px;z-index:200;
 background:#101828;color:#fff;
 padding:12px 16px;border-radius:11px;
 box-shadow:var(--shadow);max-width:370px
}

.aiHero{
 background:linear-gradient(135deg,#111827,#1e3a8a);
 color:#fff
}
.aiChat{
 height:440px;overflow:auto;
 background:#f8fafc;border-radius:13px;
 padding:14px
}
.aiMsg{
 max-width:82%;
 padding:11px 13px;
 border-radius:14px;
 margin-bottom:10px;
 line-height:1.5
}
.aiMsg.me{
 margin-left:auto;
 background:#dbeafe
}
.aiMsg.bot{
 background:#fff;
 border:1px solid var(--line)
}
.aiForm{
 display:flex;gap:8px;margin-top:10px
}
.aiForm input{
 flex:1;padding:12px;
 border:1px solid var(--line);
 border-radius:12px;outline:none
}

.chatBox{
 height:540px;
 display:grid;
 grid-template-columns:230px 1fr;
 border:1px solid var(--line);
 border-radius:14px;
 overflow:hidden
}
.chatUsers{
 border-right:1px solid var(--line);
 overflow:auto
}
.chatUser{
 width:100%;border:0;
 border-bottom:1px solid #f0f2f5;
 background:#fff;text-align:left;
 padding:12px
}
.chatUser:hover,.chatUser.active{background:#eef4fb}
.chatMain{display:flex;flex-direction:column}
.messages{
 flex:1;overflow:auto;
 padding:14px;background:#f8fafc
}
.bubble{
 max-width:76%;
 padding:10px 12px;
 background:#fff;border:1px solid var(--line);
 border-radius:14px;margin-bottom:8px
}
.bubble.me{
 margin-left:auto;background:#dbeafe
}
.sendRow{
 display:flex;gap:8px;
 padding:10px;border-top:1px solid var(--line)
}
.sendRow input{
 flex:1;padding:11px;
 border:1px solid var(--line);
 border-radius:10px
}

.bottom{
 display:none
}

.empty{
 text-align:center;padding:30px 15px;
 color:var(--muted)
}

@media(max-width:1000px){
 .layout{grid-template-columns:190px minmax(0,1fr)}
 .right{display:none}
}
@media(max-width:700px){
 .top{height:58px}
 .topin{width:calc(100% - 12px)}
 .logo{font-size:20px}
 .search{max-width:none}
 .hideMobile{display:none!important}
 .layout{
  display:block;width:100%;
  margin:9px 0 72px
 }
 .side{display:none}
 .main{padding:0 7px}
 .card{padding:13px;border-radius:14px}
 .hero h1{font-size:25px}
 .grid2{grid-template-columns:1fr}
 .stats{gap:5px}
 .postactions{grid-template-columns:repeat(4,1fr)}
 .postactions button{font-size:12px}
 .chatBox{grid-template-columns:1fr;height:570px}
 .chatUsers{display:none}
 .bottom{
  position:fixed;left:0;right:0;bottom:0;
  height:63px;background:#fff;
  border-top:1px solid var(--line);
  z-index:60;
  display:flex;justify-content:space-around
 }
 .bottom button{
  border:0;background:#fff;
  color:#475467;font-size:10px;font-weight:800
 }
 .bottom b{display:block;font-size:20px}
}
</style>
</head>

<body>

<header class="top">
 <div class="topin">

  <div class="logo">Work<span>Lynk</span></div>

  <input
   id="globalSearch"
   class="search"
   placeholder="Search people, jobs, businesses, projects..."
   onkeydown="if(event.key==='Enter')searchAll(this.value)"
  >

  <div class="topactions">
   <button class="iconbtn" onclick="showPage('ai')" title="Lynk AI">🤖</button>
   <button class="iconbtn hideMobile" onclick="showPage('chat')" title="Messages">💬</button>
   <button class="iconbtn hideMobile" onclick="showPage('notifications')" title="Notifications">🔔</button>
   <button id="topAvatar" class="avatar" onclick="showPage('profile')">W</button>
  </div>

 </div>
</header>


<div class="layout">

<aside class="side">

 <button class="nav active" data-page="home" onclick="showPage('home')">🏠 Home</button>
 <button class="nav" data-page="network" onclick="showPage('network')">🤝 My Network</button>
 <button class="nav" data-page="jobs" onclick="showPage('jobs')">💼 Jobs</button>
 <button class="nav" data-page="projects" onclick="showPage('projects')">🚀 Projects</button>
 <button class="nav" data-page="business" onclick="showPage('business')">🏢 Business</button>
 <button class="nav" data-page="profile" onclick="showPage('profile')">👤 Profile</button>
 <button class="nav" data-page="chat" onclick="showPage('chat')">💬 Messaging</button>
 <button class="nav" data-page="notifications" onclick="showPage('notifications')">🔔 Notifications</button>
 <button class="nav" data-page="ai" onclick="showPage('ai')">🤖 Lynk AI</button>

 <hr style="border:0;border-top:1px solid var(--line);margin:10px 0">

 <button class="nav" onclick="openModal('createPost')">✍️ Create Post</button>
 <button class="nav" onclick="openModal('createJob')">➕ Post a Job</button>
 <button class="nav" onclick="openModal('createProject')">🛠️ Start Project</button>

</aside>


<main id="app" class="main"></main>


<aside class="right">

 <div class="sectiontitle">
  <b>WorkLynk</b>
  <span class="small muted">Professional Hub</span>
 </div>

 <p class="muted small">
  Where People, Skills & Opportunities Work Together.
 </p>

 <div style="height:12px"></div>

 <div class="listitem">
  <b>Profile Strength</b>
  <div class="progress" style="margin:9px 0">
   <i id="profileProgress" style="width:20%"></i>
  </div>
  <span id="profileProgressText" class="small muted">20% complete</span>
 </div>

 <div class="listitem">
  <b>Quick Actions</b>
  <div class="chips">
   <button class="btn" onclick="openModal('createPost')">Post</button>
   <button class="btn gray" onclick="showPage('jobs')">Jobs</button>
   <button class="btn gray" onclick="showPage('ai')">AI</button>
  </div>
 </div>

 <div class="listitem">
  <b>Build your network</b>
  <p class="small muted" style="margin-top:6px">
   Connect with professionals and discover opportunities.
  </p>
 </div>

</aside>

</div>


<nav class="bottom">
 <button onclick="showPage('home')"><b>⌂</b>Home</button>
 <button onclick="showPage('network')"><b>♙</b>Network</button>
 <button onclick="showPage('jobs')"><b>▣</b>Jobs</button>
 <button onclick="showPage('chat')"><b>◌</b>Chat</button>
 <button onclick="showPage('profile')"><b>◯</b>Me</button>
</nav>


<div id="modalRoot"></div>
<div id="toastRoot"></div>


<script>

/* =========================================================
   WORKLYNK CONFIG
========================================================= */

const SUPABASE_URL =
 "https://eaowxilhfzyukzetgqxo.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_Z3xsADypaOjX8GEQEOLUdg_vbxynHRx";

const supabaseClient =
 supabase.createClient(SUPABASE_URL,SUPABASE_KEY);


/*
  OPTIONAL REAL AI BACKEND

  Example:
  window.LYNK_AI_ENDPOINT =
    "https://YOUR-PROJECT.supabase.co/functions/v1/lynk-ai";

  DO NOT PUT SECRET AI API KEYS HERE.
*/
window.LYNK_AI_ENDPOINT = "";


let currentUser=null;
let currentProfile=null;
let currentPage="home";
let currentChatUser=null;
let messageChannel=null;

let cache={
 posts:[],
 profiles:[],
 jobs:[],
 projects:[],
 businesses:[],
 notifications:[]
};


/* =========================================================
   HELPERS
========================================================= */

function esc(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function safeUrl(url){
 return /^https?:\/\//i.test(String(url||""))
  ? String(url)
  : "#";
}

function initials(name){
 return (
  String(name||"User")
   .trim()
   .split(/\s+/)
   .map(x=>x[0])
   .join("")
   .slice(0,2)
  ||"U"
 ).toUpperCase();
}

function toast(message){
 const el=document.createElement("div");
 el.className="toast";
 el.textContent=message;
 document.getElementById("toastRoot").appendChild(el);
 setTimeout(()=>el.remove(),3000);
}

function loading(text="Loading..."){
 return `<div class="card"><div class="empty">${esc(text)}</div></div>`;
}

async function db(table,fn){
 try{
  const result=await fn();
  if(result.error)throw result.error;
  return result.data??[];
 }catch(error){
  console.warn("WorkLynk:",table,error);
  return null;
 }
}

function avatarHTML(profile,sizeClass="avatar"){
 const name=profile?.full_name||"User";
 if(profile?.avatar_url){
  return `
   <div class="${sizeClass}">
    <img
     src="${safeUrl(profile.avatar_url)}"
     alt=""
     onerror="this.parentElement.innerHTML='${esc(initials(name))}'"
    >
   </div>`;
 }
 return `<div class="${sizeClass}">${esc(initials(name))}</div>`;
}


/* =========================================================
   AUTH
========================================================= */

async function initialize(){

 const {
  data:{session}
 }=await supabaseClient.auth.getSession();

 currentUser=session?.user||null;

 if(currentUser){
  await loadProfile();
 }

 renderHome();

 supabaseClient.auth.onAuthStateChange(()=>{
  setTimeout(async()=>{
   const {
    data:{session}
   }=await supabaseClient.auth.getSession();

   currentUser=session?.user||null;

   if(currentUser){
    await loadProfile();
   }

   if(currentPage==="home"){
    renderHome();
   }
  },0);
 });
}

async function requireAuth(){

 if(currentUser)return true;

 openModal("auth");
 return false;
}

async function loadProfile(){

 if(!currentUser)return;

 const profile=await db(
  "profiles",
  ()=>supabaseClient
   .from("profiles")
   .select("*")
   .eq("id",currentUser.id)
   .maybeSingle()
 );

 currentProfile=profile||{
  id:currentUser.id,
  email:currentUser.email,
  full_name:
   currentUser.user_metadata?.full_name||
   currentUser.email?.split("@")[0]||
   "WorkLynk User"
 };

 updateTopAvatar();
 updateProfileStrength();
}

function updateTopAvatar(){

 const el=document.getElementById("topAvatar");
 if(!el)return;

 if(currentProfile?.avatar_url){
  el.innerHTML=
   `<img src="${safeUrl(currentProfile.avatar_url)}" alt="">`;
 }else{
  el.textContent=initials(currentProfile?.full_name);
 }
}

function updateProfileStrength(){

 if(!currentProfile)return;

 const fields=[
  "full_name",
  "headline",
  "about",
  "company_name",
  "location",
  "skills",
  "experience",
  "education",
  "linkedin_url",
  "github_url",
  "portfolio_url",
  "avatar_url"
 ];

 const completed=fields.filter(
  key=>currentProfile[key] &&
       String(currentProfile[key]).trim()
 ).length;

 const percent=Math.round(
  completed/fields.length*100
 );

 const bar=document.getElementById("profileProgress");
 const text=document.getElementById("profileProgressText");

 if(bar)bar.style.width=percent+"%";
 if(text)text.textContent=percent+"% complete";
}


/* =========================================================
   NAVIGATION
========================================================= */

function setActivePage(page){

 document.querySelectorAll(".nav").forEach(btn=>{
  btn.classList.toggle(
   "active",
   btn.dataset.page===page
  );
 });
}

async function showPage(page){

 currentPage=page;
 setActivePage(page);

 if(
  !currentUser &&
  !["home","jobs","ai"].includes(page)
 ){
  if(!(await requireAuth()))return;
 }

 if(page==="home")return renderHome();
 if(page==="network")return renderNetwork();
 if(page==="jobs")return renderJobs();
 if(page==="projects")return renderProjects();
 if(page==="business")return renderBusiness();
 if(page==="profile")return renderProfile();
 if(page==="chat")return renderChat();
 if(page==="notifications")return renderNotifications();
 if(page==="ai")return renderAI();
}


/* =========================================================
   HOME / FEED
========================================================= */

function renderHome(){

 document.getElementById("app").innerHTML=`

  <section class="card hero">
   <h1>Build your professional world.</h1>

   <p>
    Connect with people, showcase skills,
    discover opportunities and grow with WorkLynk.
   </p>

   <div class="heroActions">
    <button class="btn" onclick="showPage('jobs')">
     Explore Jobs
    </button>

    <button class="btn outline" onclick="showPage('ai')">
     🤖 Ask Lynk AI
    </button>

    <button class="btn gray" onclick="showPage('network')">
     🤝 Grow Network
    </button>
   </div>
  </section>


  <section class="card">
   <div class="composer">

    ${avatarHTML(currentProfile)}

    <input
     class="composerInput"
     placeholder="Start a post, share an idea or opportunity..."
     onclick="openModal('createPost')"
     readonly
    >

   </div>
  </section>


  <div id="feed">
   ${loading("Loading your professional feed...")}
  </div>
 `;

 loadFeed();
}

async function loadFeed(){

 const posts=await db(
  "posts",
  ()=>supabaseClient
   .from("posts")
   .select("*,profiles(*)")
   .order("created_at",{ascending:false})
   .limit(50)
 );

 cache.posts=posts||[];

 const feed=document.getElementById("feed");

 if(!feed)return;

 if(!cache.posts.length){
  feed.innerHTML=`
   <div class="card empty">
    <h3>No posts yet</h3>
    <p>Be the first person to share something valuable.</p>
   </div>`;
  return;
 }

 feed.innerHTML=cache.posts
  .map(renderPost)
  .join("");
}

function renderPost(post){

 const profile=post.profiles||{};
 const mine=currentUser &&
            post.user_id===currentUser.id;

 const media=post.media_url
  ? (
    String(post.media_type||"")
     .toLowerCase()
     .includes("video")
    ?
    `<video
      class="postmedia"
      controls
      src="${safeUrl(post.media_url)}"
     ></video>`
    :
    `<img
      class="postmedia"
      src="${safeUrl(post.media_url)}"
      alt="Post media"
     >`
   )
  :"";

 return `
 <article class="card" id="post-${post.id}">

  <div class="posthead">

   ${avatarHTML(profile)}

   <div class="grow">
    <b>${esc(profile.full_name||"WorkLynk Member")}</b>

    <div class="small muted">
     ${esc(
      profile.headline||
      profile.company_name||
      "Professional"
     )}
     ·
     ${new Date(post.created_at).toLocaleString()}
    </div>
   </div>

   ${
    mine
    ?
    `<button
      class="iconbtn"
      onclick="deletePost(${post.id})"
      title="Delete"
     >⋮</button>`
    :""
   }

  </div>

  ${
   post.caption
   ?
   `<div class="postcaption">
     ${esc(post.caption)}
    </div>`
   :""
  }

  ${media}

  <div class="postactions">

   <button
    onclick="likePost(${post.id},this)"
   >
    ❤️ Like
   </button>

   <button
    onclick="toggleComments(${post.id})"
   >

async function drawNetwork(list){

 const connections=await db(
  "connections",
  ()=>supabaseClient
   .from("connections")
   .select("*")
   .or(
    `requester_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`
   )
 );

 const map=new Map();

 (connections||[]).forEach(c=>{
  const other=
   c.requester_id===currentUser.id
   ?c.receiver_id
   :c.requester_id;

  map.set(other,c);
 });

 const el=document.getElementById("networkList");

 if(!el)return;

 el.innerHTML=list.map(profile=>{

  const c=map.get(profile.id);

  let button="Connect";
  let cls="btn";

  if(c?.status==="accepted"){
   button="✓ Connected";
   cls="btn gray";
  }else if(
   c?.status==="pending" &&
   c.requester_id===currentUser.id
  ){
   button="Pending";
   cls="btn gray";
  }else if(
   c?.status==="pending" &&
   c.receiver_id===currentUser.id
  ){
   button="Accept";
   cls="btn green";
  }

  return `
   <div class="listitem"
    style="display:flex;gap:12px;align-items:center">

    ${avatarHTML(profile)}

    <div class="grow">
     <b>${esc(profile.full_name)}</b>

     <div class="small muted">
      ${esc(
       profile.headline||
       profile.company_name||
       "Professional"
      )}
     </div>

     <div class="small muted">
      ${esc(profile.location||"")}
     </div>

     <div class="chips">
      ${String(profile.skills||"")
       .split(",")
       .filter(Boolean)
       .slice(0,5)
       .map(s=>
        `<span class="chip">
         ${esc(s.trim())}
        </span>`
       ).join("")
      }
     </div>
    </div>

    <button
     class="${cls}"
     onclick="connectionAction(
      '${profile.id}',
      ${c?JSON.stringify(c):"null"}
     )"
    >
     ${button}
    </button>

   </div>
  `;

 }).join("")||
 `<div class="empty">No professionals found.</div>`;
}

function filterNetwork(q){

 q=q.toLowerCase();

 drawNetwork(
  cache.profiles.filter(p=>
   JSON.stringify(p)
    .toLowerCase()
    .includes(q)
  )
 );
}

async function connectionAction(id,connection){

 if(!currentUser)return;

 if(!connection){

  const r=await supabaseClient
   .from("connections")
   .insert({
    requester_id:currentUser.id,
    receiver_id:id,
    status:"pending"
   });

  if(r.error){
   toast(r.error.message);
   return;
  }

  toast("Connection request sent");

 }else if(
  connection.status==="pending" &&
  connection.receiver_id===currentUser.id
 ){

  const r=await supabaseClient
   .from("connections")
   .update({
    status:"accepted",
    updated_at:new Date().toISOString()
   })
   .eq("id",connection.id);

  if(r.error){
   toast(r.error.message);
   return;
  }

  toast("Connection accepted");

 }else if(connection.status==="accepted"){

  toast("Already connected");

 }else{

  toast("Request pending");
 }

 renderNetwork();
}

  .map(c=>
   c.requester_id===currentUser.id
   ?c.receiver_id
   :c.requester_id
  );

 let profiles=[];

 if(ids.length){

  profiles=await db(
   "profiles",
   ()=>supabaseClient
    .from("profiles")
    .select("*")
    .in("id",ids)
  );
 }

 const users=document.getElementById("chatUsers");

 users.innerHTML=(profiles||[])
  .map(profile=>`
   <button
    class="chatUser"
    onclick="openChat('${profile.id}',this)"
   >
    <b>${esc(profile.full_name)}</b>
    <div class="small muted">
     ${esc(profile.headline||"")}
    </div>
   </button>
  `)
  .join("")||
  `<div class="empty">
    No accepted connections yet.
   </div>`;

 subscribeMessages();
}

function openChat(id,button){

 currentChatUser=id;

 document.querySelectorAll(".chatUser")
  .forEach(x=>x.classList.remove("active"));

 button?.classList.add("active");

 loadMessages();
}

async function loadMessages(){

 if(!currentChatUser)return;

 const filter=
  `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser}),`+
  `and(sender_id.eq.${currentChatUser},receiver_id.eq.${currentUser.id})`;

 const messages=await db(
  "messages",
  ()=>supabaseClient
   .from("messages")
   .select("*")
   .or(filter)
   .order("created_at",{ascending:true})
 );

 const el=document.getElementById("messages");

 if(!el)return;

 el.innerHTML=(messages||[])
  .map(message=>`
   <div class="bubble ${
    message.sender_id===currentUser.id
    ?"me":""
   }">

    ${esc(message.content)}

    <div class="small muted" style="margin-top:4px">
     ${new Date(
      message.created_at
     ).toLocaleTimeString()}
    </div>

   </div>
  `)
  .join("")||
  `<div class="empty">No messages yet.</div>`;

 el.scrollTop=el.scrollHeight;
}

async function sendMessage(){

 if(!currentChatUser){
  toast("Select a connection first");
  return;
 }

 const input=document.getElementById("chatInput");
 const content=input?.value.trim();

 if(!content)return;

 input.value="";

 const r=await supabaseClient
  .from("messages")
  .insert({
   sender_id:currentUser.id,
   receiver_id:currentChatUser,
   content
  });

 if(r.error){
  toast(r.error.message);
  return;
 }

 loadMessages();
}

function subscribeMessages(){

 if(messageChannel){
  supabaseClient.removeChannel(messageChannel);
 }

 messageChannel=
  supabaseClient
   .channel("worklynk-messages")
   .on(
    "postgres_changes",
    {
     event:"INSERT",
     schema:"public",
     table:"messages"
    },
    payload=>{
     if(
      currentPage==="chat" &&
      currentChatUser &&
      (
       payload.new.sender_id===currentChatUser||
       payload.new.receiver_id===currentChatUser
      )
     ){
      loadMessages();
     }
    }
   )
   .subscribe();
}

function aiQuick(text){

async function askAI(){

 const input=document.getElementById("aiInput");
 const chat=document.getElementById("aiChat");

 if(!input||!chat)return;

 const question=input.value.trim();

 if(!question)return;

 input.value="";

 chat.innerHTML+=`
  <div class="aiMsg me">
   ${esc(question)}
  </div>
 `;

 const endpoint=
  window.LYNK_AI_ENDPOINT||"";

 /*
   REAL AI
 */
 if(endpoint){

  try{

   const response=await fetch(
    endpoint,
    {
     method:"POST",
     headers:{
      "Content-Type":"application/json"
     },
     body:JSON.stringify({
      message:question,
      user_id:currentUser?.id||null,
      profile:currentProfile||null
     })
    }
   );

   const data=await response.json();

   const answer=
    data.answer||
    data.message||
    "No AI response.";

   chat.innerHTML+=`
    <div class="aiMsg bot">
     <b>🤖 Lynk AI</b><br><br>
     ${esc(answer)}
    </div>
   `;

   chat.scrollTop=chat.scrollHeight;

   return;

  }catch(error){
   console.warn(error);
  }
 }

 /*
   FALLBACK AI
   Keeps the UI functional even before
   a real AI Edge Function is connected.
 */

 const answer=localAI(question);

 chat.innerHTML+=`
  <div class="aiMsg bot">
   <b>🤖 Lynk AI</b><br><br>
   ${esc(answer)}
  </div>
 `;

 chat.scrollTop=chat.scrollHeight;
}

/* =========================================================
   AUTH ACTIONS
========================================================= */

async function signUp(){

 const email=
  document.getElementById("authEmail")
   ?.value.trim();

 const password=
  document.getElementById("authPass")
   ?.value;

 const name=
  document.getElementById("authName")
   ?.value.trim();

 if(!email||!password){
  toast("Email and password required");
  return;
 }

 if(password.length<6){
  toast("Password must contain at least 6 characters");
  return;
 }

 const result=
  await supabaseClient.auth.signUp({
   email,
   password,
   options:{
    data:{
     full_name:name
    }
   }
  });

 if(result.error){
  toast(result.error.message);
  return;
 }

 if(result.data.user){

  await supabaseClient
   .from("profiles")
   .upsert({
    id:result.data.user.id,
    email,
    full_name:name||
     email.split("@")[0]
   });
 }

 toast(
  "Account created. Check email if confirmation is enabled."
 );

 closeModal();

 await ensureSession();
}

async function signIn(){

 const email=
  document.getElementById("authEmail")
   ?.value.trim();

 const password=
  document.getElementById("authPass")
   ?.value;

 const result=
  await supabaseClient.auth
   .signInWithPassword({
    email,
    password
   });

 if(result.error){
  toast(result.error.message);
  return;
 }

 closeModal();

 await ensureSession();

 toast("Welcome back to WorkLynk");

 showPage(currentPage);
}

async function ensureSession(){

 const {
  data:{session}
 }=await supabaseClient.auth.getSession();

 currentUser=session?.user||null;

 if(currentUser){
  await loadProfile();
 }
}

async function signOut(){

 await supabaseClient.auth.signOut();

 currentUser=null;
 currentProfile=null;

 closeModal();

 toast("Signed out");

 renderHome();
}

async function createPost(){

 if(!(await requireAuth()))return;

 const caption=
  document.getElementById("postCaption")
   ?.value.trim();

 const media=
  document.getElementById("postMedia")
   ?.value.trim();

 const mediaType=
  document.getElementById("postMediaType")
   ?.value;

 if(!caption&&!media){
  toast("Write something before publishing");
  return;
 }

 const result=
  await supabaseClient
   .from("posts")
   .insert({
    user_id:currentUser.id,
    caption:caption||"",
    media_url:media||null,
    media_type:media?mediaType:null
   });

 if(result.error){
  toast(result.error.message);
  return;
 }

 toast("Post published");

 closeModal();

 showPage("home");
}

 const skills=

   ?.value

   .filter(Boolean);

 const result=
  await supabaseClient
   .from("jobs")
   .insert({

}
