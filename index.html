<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>One Minute News</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    background:#fff;
    font-family:Arial,Helvetica,sans-serif;
    color:#111;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

button{
    border:0;
    outline:0;
}

/* APP */

.app{
    width:100vw;
    height:100dvh;
    max-width:430px;
    margin:0 auto;
    background:#fff;
    position:relative;
    overflow:hidden;
}

/* ================= LOGIN ================= */

.login-screen{
    position:absolute;
    inset:0;
    z-index:1000;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.login-box{
    width:100%;
    max-width:350px;
    text-align:center;
}

.login-logo{
    width:72px;
    height:72px;
    margin:0 auto 18px;
    border-radius:18px;
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:15px;
    font-weight:900;
}

.login-title{
    font-size:27px;
    font-weight:900;
    margin-bottom:7px;
}

.login-sub{
    color:#777;
    font-size:14px;
    margin-bottom:25px;
}

.phone-wrap{
    height:54px;
    width:100%;
    display:flex;
    align-items:center;
    background:#f7f7f7;
    border:1px solid #ddd;
    border-radius:14px;
    overflow:hidden;
}

.phone-prefix{
    height:100%;
    display:flex;
    align-items:center;
    padding:0 13px;
    font-weight:800;
    border-right:1px solid #ddd;
}

.phone-wrap input{
    flex:1;
    height:100%;
    border:0;
    outline:0;
    background:transparent;
    padding:0 13px;
    font-size:17px;
}

.continue-btn{
    width:100%;
    height:54px;
    margin-top:13px;
    border-radius:14px;
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
    color:#fff;
    font-weight:900;
    font-size:16px;
}

.login-error{
    color:#d32f2f;
    font-size:12px;
    min-height:20px;
    margin-top:9px;
}

/* ================= HEADER ================= */

.header{
    height:56px;
    width:100%;
    flex-shrink:0;
    background:#fff;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 10px;
    position:absolute;
    top:0;
    left:0;
    z-index:80;
}

.brand{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:16px;
    font-weight:900;
}

.brand-icon{
    padding:5px 7px;
    border-radius:6px;
    color:#fff;
    font-size:9px;
    font-weight:900;
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
}

.header-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#f5f5f5;
    color:#444;
}

/* ================= CATEGORY ================= */

.category-bar{
    position:absolute;
    top:56px;
    left:0;
    width:100%;
    height:42px;
    z-index:75;
    display:flex;
    align-items:center;
    gap:7px;
    padding:5px 9px;
    overflow-x:auto;
    background:#fff;
    border-bottom:1px solid #eee;
    scrollbar-width:none;
}

.category-bar::-webkit-scrollbar{
    display:none;
}

.category{
    flex-shrink:0;
    padding:7px 12px;
    border-radius:18px;
    background:#f2f2f2;
    color:#555;
    font-size:11px;
    font-weight:800;
}

.category.active{
    background:#ff416c;
    color:#fff;
}

/* ================= TICKER ================= */

.ticker{
    position:absolute;
    top:98px;
    left:0;
    width:100%;
    height:29px;
    z-index:74;
    display:flex;
    align-items:center;
    background:#111;
    color:#fff;
    overflow:hidden;
}

.breaking{
    height:100%;
    display:flex;
    align-items:center;
    padding:0 8px;
    background:#e60023;
    font-size:9px;
    font-weight:900;
    flex-shrink:0;
}

.ticker-track{
    white-space:nowrap;
    padding-left:12px;
    font-size:10px;
    animation:ticker 24s linear infinite;
}

@keyframes ticker{
    from{
        transform:translateX(100%);
    }
    to{
        transform:translateX(-100%);
    }
}

/* ================= FEED ================= */

.feed{
    position:absolute;
    top:127px;
    left:0;
    right:0;
    bottom:0;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    scroll-behavior:smooth;
    scrollbar-width:none;
    background:#fff;
}

.feed::-webkit-scrollbar{
    display:none;
}

/* ================= NEWS CARD ================= */

.news-card{
    width:100%;
    height:calc(100dvh - 127px);
    min-height:calc(100dvh - 127px);
    scroll-snap-align:start;
    scroll-snap-stop:always;
    position:relative;
    display:flex;
    flex-direction:column;
    background:#fff;
    overflow:hidden;
}

/* MEDIA */

.media{
    width:100%;
    height:43%;
    min-height:210px;
    max-height:330px;
    flex-shrink:0;
    position:relative;
    overflow:hidden;
    background:#111;
}

.media img,
.media video{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.media-badge{
    position:absolute;
    top:10px;
    left:10px;
    padding:5px 8px;
    border-radius:5px;
    background:#e60023;
    color:#fff;
    font-size:9px;
    font-weight:900;
}

.category-label{
    position:absolute;
    bottom:9px;
    left:10px;
    padding:5px 9px;
    border-radius:13px;
    background:rgba(0,0,0,.7);
    color:#fff;
    font-size:10px;
    font-weight:700;
}

/* CONTENT */

.news-content{
    flex:1;
    overflow:hidden;
    padding:13px 16px 4px;
}

.news-title{
    font-size:21px;
    line-height:1.32;
    font-weight:900;
    margin-bottom:8px;
}

.news-body{
    font-size:14px;
    line-height:1.6;
    color:#444;
    white-space:pre-line;
    overflow:hidden;
}

.news-meta{
    display:flex;
    justify-content:space-between;
    margin-top:9px;
    font-size:10px;
    color:#999;
}

/* ================= CARD ACTIONS ================= */

.card-actions{
    height:57px;
    flex-shrink:0;
    width:100%;
    border-top:1px solid #eee;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-around;
}

.card-action{
    min-width:48px;
    height:48px;
    background:transparent;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:3px;
    color:#666;
    font-size:10px;
    font-weight:700;
}

.card-action i{
    font-size:18px;
}

.card-action.like.active{
    color:#2e7d32;
}

.card-action.dislike.active{
    color:#d32f2f;
}

.whatsapp-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#25D366;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}

/* ================= BOTTOM NAV ================= */

.bottom{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:0;
    z-index:70;
    pointer-events:none;
}

/* ================= LOADING ================= */

.loading{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#888;
    font-size:13px;
}

/* ================= OVERLAY ================= */

.overlay{
    position:absolute;
    inset:0;
    z-index:150;
    background:rgba(0,0,0,.45);
    display:none;
}

.overlay.show{
    display:block;
}

/* ================= SIDE MENU ================= */

.side-menu{
    position:absolute;
    top:0;
    right:-88%;
    width:84%;
    height:100%;
    background:#fff;
    z-index:200;
    transition:.28s ease;
    box-shadow:-10px 0 35px rgba(0,0,0,.2);
}

.side-menu.open{
    right:0;
}

.menu-head{
    padding:18px 15px;
    border-bottom:1px solid #eee;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.menu-user{
    font-weight:900;
}

.menu-phone{
    color:#888;
    font-size:12px;
    margin-top:3px;
}

.close{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#f2f2f2;
}

.menu-list{
    padding:10px;
}

.menu-item{
    width:100%;
    min-height:50px;
    background:#fff;
    display:flex;
    align-items:center;
    gap:13px;
    padding:12px;
    border-radius:11px;
    text-align:left;
    font-weight:700;
}

.menu-item i{
    width:24px;
    color:#ff416c;
}

/* ================= MODAL ================= */

.modal{
    position:absolute;
    left:0;
    right:0;
    bottom:-100%;
    max-height:88%;
    background:#fff;
    z-index:300;
    border-radius:20px 20px 0 0;
    padding:16px;
    transition:.3s ease;
    overflow-y:auto;
}

.modal.open{
    bottom:0;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:17px;
    font-weight:900;
    margin-bottom:15px;
}

.form-group{
    margin-bottom:12px;
}

.form-group label{
    display:block;
    margin-bottom:5px;
    color:#555;
    font-size:11px;
    font-weight:800;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    border:1px solid #ddd;
    background:#fafafa;
    border-radius:10px;
    padding:11px;
    outline:none;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.file-box{
    padding:11px;
    border:1px dashed #ccc;
    border-radius:10px;
    background:#fafafa;
}

.preview{
    display:none;
    width:100%;
    max-height:170px;
    object-fit:cover;
    margin-top:8px;
    border-radius:9px;
}

.primary{
    width:100%;
    height:48px;
    border-radius:11px;
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
    color:#fff;
    font-weight:900;
}

.status{
    min-height:18px;
    text-align:center;
    font-size:11px;
    margin:7px 0;
}

/* COMMENTS */

.comments-list{
    max-height:330px;
    overflow:auto;
    margin-bottom:10px;
}

.comment{
    background:#f5f5f5;
    padding:10px;
    border-radius:9px;
    margin-bottom:7px;
    font-size:13px;
}

.comment b{
    display:block;
    margin-bottom:3px;
}

.comment-form{
    display:flex;
    gap:7px;
}

.comment-form input{
    flex:1;
    border:1px solid #ddd;
    border-radius:22px;
    padding:10px 13px;
    outline:none;
}

.comment-form button{
    border-radius:22px;
    padding:0 15px;
    background:#ff416c;
    color:#fff;
    font-weight:800;
}

/* ================= EMPTY ================= */

.empty{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#777;
    padding:25px;
}

/* ================= DESKTOP ================= */

@media(min-width:431px){

    .app{
        height:100dvh;
    }
}

/* ================= SMALL SCREEN ================= */

@media(max-height:650px){

    .media{
        height:39%;
        min-height:170px;
    }

    .news-title{
        font-size:18px;
    }

    .news-body{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">

    <div class="login-box">

        <div class="login-logo">
            1 MIN
        </div>

        <div class="login-title">
            One Minute News
        </div>

        <div class="login-sub">
            మీ మొబైల్ నంబర్ నమోదు చేసి కొనసాగండి
        </div>

        <div class="phone-wrap">

            <div class="phone-prefix">
                +91
            </div>

            <input
                id="phoneInput"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                placeholder="10 digit mobile number"
                oninput="
                this.value=this.value
                .replace(/\D/g,'')
                .slice(0,10)
                "
            >

        </div>

        <button
            class="continue-btn"
            onclick="mobileLogin()">

            Continue

        </button>

        <div
            class="login-error"
            id="loginError">
        </div>

    </div>

</div>

<!-- HEADER -->

<header class="header">

    <div class="brand">

        <span class="brand-icon">
            1 MIN
        </span>

        <span>
            One Minute News
        </span>

    </div>

    <div class="header-actions">

        <button
            class="icon-btn"
            onclick="openSearch()">

            <i class="fa-solid fa-magnifying-glass"></i>

        </button>

        <button
            class="icon-btn"
            onclick="loadNews()">

            <i class="fa-solid fa-arrows-rotate"></i>

        </button>

        <button
            class="icon-btn"
            onclick="openMenu()">

            <i class="fa-solid fa-bars"></i>

        </button>

    </div>

</header>

<!-- CATEGORY -->

<div class="category-bar">

    <button
        class="category active"
        onclick="filterCategory('All',this)">
        అన్ని
    </button>

    <button
        class="category"
        onclick="filterCategory('Business',this)">
        బిజినెస్
    </button>

    <button
        class="category"
        onclick="filterCategory('Sports',this)">
        స్పోర్ట్స్
    </button>

    <button
        class="category"
        onclick="filterCategory('Cinema',this)">
        సినిమా
    </button>

    <button
        class="category"
        onclick="filterCategory('Tech',this)">
        టెక్
    </button>

    <button
        class="category"
        onclick="filterCategory('Politics',this)">
        పాలిటిక్స్
    </button>

    <button
        class="category"
        onclick="filterCategory('Local',this)">
        లోకల్
    </button>

</div>

<!-- TICKER -->

<div class="ticker">

    <div class="breaking">
        BREAKING
    </div>

    <div
        class="ticker-track"
        id="tickerText">
        తాజా వార్తలు One Minute Newsలో...
    </div>

</div>

<!-- NEWS FEED -->

<main
    class="feed"
    id="feed">

    <div class="loading">
        <i class="fa-solid fa-spinner fa-spin"></i>
        &nbsp; వార్తలు లోడ్ అవుతున్నాయి...
    </div>

</main>

<!-- OVERLAY -->

<div
    class="overlay"
    id="overlay"
    onclick="closeAll()">
</div>

<!-- SIDE MENU -->

<div
    class="side-menu"
    id="sideMenu">

    <div class="menu-head">

        <div>

            <div class="menu-user">
                One Minute Reader
            </div>

            <div
                class="menu-phone"
                id="menuPhone">
            </div>

        </div>

        <button
            class="close"
            onclick="closeAll()">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>

    <div class="menu-list">

        <button
            class="menu-item"
            onclick="openCreateNews()">

            <i class="fa-solid fa-pen-to-square"></i>

            <span>
                Create News
            </span>

        </button>

        <button
            class="menu-item"
            onclick="openSuggestion()">

            <i class="fa-regular fa-lightbulb"></i>

            <span>
                Send Suggestion
            </span>

        </button>

        <button
            class="menu-item"
            onclick="openSearch()">

            <i class="fa-solid fa-magnifying-glass"></i>

            <span>
                Search News
            </span>

        </button>

        <button
            class="menu-item"
            onclick="openSaved()">

            <i class="fa-regular fa-bookmark"></i>

            <span>
                Saved News
            </span>

        </button>

        <button
            class="menu-item"
            onclick="loadNews();closeAll()">

            <i class="fa-solid fa-rotate"></i>

            <span>
                Refresh News
            </span>

        </button>

        <button
            class="menu-item"
            onclick="logout()">

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>
                Change Mobile Number
            </span>

        </button>

    </div>

</div>

<!-- CREATE NEWS -->

<div
    class="modal"
    id="createModal">

    <div class="modal-head">

        <span>
            Create News
        </span>

        <button
            class="close"
            onclick="closeModal('createModal')">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>

    <div class="form-group">

        <label>
            Category
        </label>

        <select id="createCategory">

            <option>Local</option>
            <option>Business</option>
            <option>Sports</option>
            <option>Cinema</option>
            <option>Tech</option>
            <option>Politics</option>
            <option>News</option>

        </select>

    </div>

    <div class="form-group">

        <label>
            Headline
        </label>

        <input
            id="createTitle"
            placeholder="వార్త headline">

    </div>

    <div class="form-group">

        <label>
            News Details
        </label>

        <textarea
            id="createBody"
            placeholder="వార్త పూర్తి వివరాలు రాయండి...">
        </textarea>

    </div>

    <div class="form-group">

        <label>
            Photo / Video
        </label>

        <div class="file-box">

            <input
                id="newsFile"
                type="file"
                accept="image/*,video/*"
                onchange="previewNewsFile()">

            <img
                id="newsPreviewImage"
                class="preview">

            <video
                id="newsPreviewVideo"
                class="preview"
                controls>
            </video>

        </div>

    </div>

    <div
        class="status"
        id="createStatus">
    </div>

    <button
        class="primary"
        onclick="createNews()">

        <i class="fa-solid fa-cloud-arrow-up"></i>
        Publish News

    </button>

</div>

<!-- SUGGESTION -->

<div
    class="modal"
    id="suggestionModal">

    <div class="modal-head">

        <span>
            Send Suggestion
        </span>

        <button
            class="close"
            onclick="closeModal('suggestionModal')">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>

    <div class="form-group">

        <label>
            Suggestion
        </label>

        <textarea
            id="suggestionText"
            placeholder="మీ suggestion లేదా వార్త ఇక్కడ రాయండి...">
        </textarea>

    </div>

    <div class="form-group">

        <label>
            Optional Photo / Video
        </label>

        <div class="file-box">

            <input
                id="suggestionFile"
                type="file"
                accept="image/*,video/*">

        </div>

    </div>

    <div
        class="status"
        id="suggestionStatus">
    </div>

    <button
        class="primary"
        onclick="submitSuggestion()">

        <i class="fa-solid fa-paper-plane"></i>
        Send Suggestion

    </button>

</div>

<!-- COMMENTS -->

<div
    class="modal"
    id="commentsModal">

    <div class="modal-head">

        <span>
            Comments
            (<span id="modalCommentCount">0</span>)
        </span>

        <button
            class="close"
            onclick="closeModal('commentsModal')">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>

    <div
        class="comments-list"
        id="commentsList">
    </div>

    <div class="comment-form">

        <input
            id="commentInput"
            placeholder="మీ comment రాయండి...">

        <button onclick="addComment()">
            పంపు
        </button>

    </div>

</div>

<!-- SEARCH -->

<div
    class="modal"
    id="searchModal">

    <div class="modal-head">

        <span>
            Search News
        </span>

        <button
            class="close"
            onclick="closeModal('searchModal')">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>

    <div class="form-group">

        <input
            id="searchInput"
            placeholder="వార్త search చేయండి..."
            oninput="searchNews(this.value)">

    </div>

    <div id="searchResults">
    </div>

</div>

</div>

<script>

/* ===============================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://eaowxilhfzyukzetgqxo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Z3xsADypaOjX8GEQEOLUdg_vbxynHRx";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const BUCKET =
"news-media";

/* ===============================
   STATE
================================ */

let allNews=[];
let visibleNews=[];
let currentCategory="All";
let currentIndex=0;
let currentNews=null;

/* ===============================
   LOGIN
================================ */

function mobileLogin(){

    const input =
        document.getElementById("phoneInput");

    const phone =
        input.value.trim();

    const error =
        document.getElementById("loginError");

    if(!/^[6-9][0-9]{9}$/.test(phone)){

        error.innerText =
        "సరైన 10-digit mobile number ఇవ్వండి.";

        return;
    }

    localStorage.setItem(
        "oneMinuteMobile",
        "+91"+phone
    );

    document.getElementById(
        "loginScreen"
    ).style.display="none";

    document.getElementById(
        "menuPhone"
    ).innerText="+91 "+phone;

    loadNews();
}

function checkLogin(){

    const saved =
        localStorage.getItem(
            "oneMinuteMobile"
        );

    if(saved){

        document.getElementById(
            "loginScreen"
        ).style.display="none";

        document.getElementById(
            "menuPhone"
        ).innerText=saved;

        return true;
    }

    return false;
}

function logout(){

    localStorage.removeItem(
        "oneMinuteMobile"
    );

    location.reload();
}

/* ===============================
   NORMALIZE
================================ */

function normalizeNews(row){

    return {

        id:
        row.id ??
        row.news_id ??
        crypto.randomUUID(),

        title:
        row.title ??
        row.headline ??
        row.news_title ??
        row.name ??
        "తాజా వార్త",

        body:
        row.body ??
        row.content ??
        row.description ??
        row.text ??
        row.news_body ??
        row.article ??
        "",

        image:
        row.image_url ??
        row.image ??
        row.image_src ??
        row.imageSrc ??
        row.thumbnail ??
        row.photo_url ??
        "",

        video:
        row.video_url ??
        row.video ??
        row.video_src ??
        row.videoSrc ??
        "",

        media:
        row.media_url ??
        "",

        mediaType:
        row.media_type ??
        row.mediaType ??
        "",

        category:
        row.category ??
        row.section ??
        row.type_category ??
        "News",

        likes:Number(
            row.likes ??
            row.like_count ??
            row.likes_count ??
            0
        ),

        dislikes:Number(
            row.dislikes ??
            row.dislike_count ??
            row.dislikes_count ??
            0
        ),

        comments:Number(
            row.comments ??
            row.comment_count ??
            row.comments_count ??
            0
        ),

        created:
        row.created_at ??
        row.published_at ??
        row.date ??
        new Date().toISOString()
    };
}

/* ===============================
   LOAD
================================ */

async function loadNews(){

    const feed =
        document.getElementById("feed");

    feed.innerHTML=`
        <div class="loading">
            <i class="fa-solid fa-spinner fa-spin"></i>
            &nbsp; Loading...
        </div>
    `;

    try{

        let result =
        await supabaseClient
        .from("news")
        .select("*")
        .eq("is_published",true)
        .order(
            "created_at",
            {ascending:false}
        )
        .limit(100);

        if(result.error){

            result =
            await supabaseClient
            .from("news")
            .select("*")
            .order(
                "created_at",
                {ascending:false}
            )
            .limit(100);
        }

        if(result.error)
            throw result.error;

        allNews =
        (result.data||[])
        .map(normalizeNews);

        applyFilter();
        updateTicker();

    }catch(error){

        console.error(error);

        feed.innerHTML=`
            <div class="empty">
                <div>
                    <b>వార్తలు లోడ్ కాలేదు</b>
                    <br><br>
                    <button
                    class="primary"
                    style="max-width:170px"
                    onclick="loadNews()">
                    Retry
                    </button>
                </div>
            </div>
        `;
    }
}

/* ===============================
   FILTER
================================ */

function filterCategory(
    category,
    button
){

    currentCategory=category;

    document
    .querySelectorAll(".category")
    .forEach(x=>{
        x.classList.remove("active");
    });

    button.classList.add("active");

    applyFilter();
}

function applyFilter(){

    if(currentCategory==="All"){

        visibleNews=[
            ...allNews
        ];

    }else{

        visibleNews=
        allNews.filter(n=>
            String(n.category)
            .toLowerCase()===
            currentCategory.toLowerCase()
        );
    }

    renderFeed();
}

/* ===============================
   RENDER
================================ */

function renderFeed(){

    const feed =
        document.getElementById("feed");

    if(!visibleNews.length){

        feed.innerHTML=`
            <div class="empty">
                ఈ categoryలో వార్తలు లేవు.
            </div>
        `;

        return;
    }

    feed.innerHTML=
    visibleNews
    .map((news,index)=>{

        const media =
            getMediaHtml(news);

        const reaction =
            localStorage.getItem(
                "reaction_"+news.id
            );

        return `

        <article
            class="news-card"
            data-index="${index}">

            <div class="media">

                ${media}

                <div class="media-badge">
                    ${index===0?"LATEST":"NEWS"}
                </div>

                <div class="category-label">
                    ${escapeHtml(news.category)}
                </div>

            </div>

            <div class="news-content">

                <h2 class="news-title">
                    ${escapeHtml(news.title)}
                </h2>

                <p class="news-body">
                    ${escapeHtml(news.body)}
                </p>

                <div class="news-meta">

                    <span>
                        ${timeAgo(news.created)}
                    </span>

                    <span>
                        One Minute News
                    </span>

                </div>

            </div>

            <div class="card-actions">

                <button
                    class="card-action ${
                    reaction==="like"
                    ?"like active":""
                    }"
                    data-action="like">

                    <i class="fa-regular fa-thumbs-up"></i>

                    <span>
                        ${news.likes}
                    </span>

                </button>

                <button
                    class="card-action ${
                    reaction==="dislike"
                    ?"dislike active":""
                    }"
                    data-action="dislike">

                    <i class="fa-regular fa-thumbs-down"></i>

                    <span>
                        ${news.dislikes}
                    </span>

                </button>

                <button
                    class="whatsapp-btn"
                    data-action="share">

                    <i class="fa-brands fa-whatsapp"></i>

                </button>

                <button
                    class="card-action"
                    data-action="comment">

                    <i class="fa-regular fa-comment"></i>

                    <span>
                        ${news.comments}
                    </span>

                </button>

                <button
                    class="card-action"
                    data-action="save">

                    <i class="fa-regular fa-bookmark"></i>

                    <span>
                        Save
                    </span>

                </button>

            </div>

        </article>

        `;

    }).join("");

    currentIndex=0;

    attachScroll();
}

/* ===============================
   MEDIA
================================ */

function getMediaHtml(news){

    let url="";
    let type="";

    if(news.video){

        url=news.video;
        type="video";

    }else if(news.image){

        url=news.image;
        type="image";

    }else if(news.media){

        url=news.media;
        type=
        news.mediaType ||
        detectMediaType(url);
    }

    if(!url){

        return `
            <div style="
                width:100%;
                height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
                color:#aaa;
                font-size:50px">
                <i class="fa-regular fa-newspaper"></i>
            </div>
        `;
    }

    if(
        type==="video" ||
        isVideo(url)
    ){

        return `
            <video
                src="${escapeAttr(url)}"
                controls
                playsinline
                preload="metadata">
            </video>
        `;
    }

    return `
        <img
            src="${escapeAttr(url)}"
            alt="News"
            loading="lazy"
            onerror="
            this.style.display='none'
            ">
    `;
}

function detectMediaType(url){

    return isVideo(url)
        ?"video"
        :"image";
}

function isVideo(url){

    return /\.(mp4|webm|ogg|mov|m4v)(\?|$)/i
    .test(url);
}

/* ===============================
   SCROLL
================================ */

function attachScroll(){

    const feed =
        document.getElementById("feed");

    feed.onscroll=()=>{

        const cards =
        [...document.querySelectorAll(
            ".news-card"
        )];

        if(!cards.length)
            return;

        let best=0;
        let distance=Infinity;

        cards.forEach((card,i)=>{

            const d=
            Math.abs(
                card.offsetTop-
                feed.scrollTop
            );

            if(d<distance){

                distance=d;
                best=i;
            }
        });

        currentIndex=best;
        currentNews=
            visibleNews[best]||null;
    };
}

/* ===============================
   LIKE
================================ */

async function handleLike(index){

    const news=
        visibleNews[index];

    if(!news) return;

    const key=
        "reaction_"+news.id;

    const old=
        localStorage.getItem(key);

    if(old==="like"){

        news.likes--;

        localStorage.removeItem(key);

    }else{

        if(old==="dislike")
            news.dislikes--;

        news.likes++;

        localStorage.setItem(
            key,
            "like"
        );
    }

    renderFeed();

    try{

        await supabaseClient
        .from("news")
        .update({
            likes:Math.max(0,news.likes),
            dislikes:Math.max(0,news.dislikes)
        })
        .eq("id",news.id);

    }catch(e){}
}

/* ===============================
   DISLIKE

}

async function openComments(index){

    if(!currentNews)
        return;

    document
    .getElementById("commentsModal")
    .classList.add("open");

    document
    .getElementById("overlay")
    .classList.add("show");

    await loadComments();
}

async function loadComments(){

    const list=
        document.getElementById(
            "commentsList"
        );

    list.innerHTML=
        `<div class="loading">
            Loading...
        </div>`;

    try{

        const result=
        await supabaseClient
        .from("comments")
        .select("*")
        .eq(
            "news_id",
            currentNews.id
        )
        .order(
            "created_at",
            {ascending:true}
        );

        if(result.error)
            throw result.error;

        const rows=
            result.data||[];

        document
        .getElementById(
            "modalCommentCount"
        )
        .innerText=rows.length;

        if(!rows.length){

            list.innerHTML=
            `<div style="
                text-align:center;
                color:#999;
                padding:30px">
                ఇంకా comments లేవు.
            </div>`;

            return;
        }

        list.innerHTML=
        rows.map(c=>`
            <div class="comment">
                <b>
                    ${escapeHtml(
                        c.name||"Reader"
                    )}
                </b>
                ${escapeHtml(
                    c.comment||""
                )}
            </div>
        `).join("");

    }catch(e){

        list.innerHTML=
        `<div style="
            text-align:center;
            color:#999;
            padding:30px">
            Comments unavailable
        </div>`;
    }
}

async function addComment(){

    const input=
        document.getElementById(
            "commentInput"
        );

    const text=
        input.value.trim();

    if(!text || !currentNews)
        return;

    try{

        const result=
        await supabaseClient
        .from("comments")
        .insert({

            news_id:currentNews.id,

            name:"Reader",

            comment:text,

            created_at:
                new Date().toISOString()
        });

        if(result.error)
            throw result.error;

        input.value="";

        currentNews.comments++;

        await loadComments();

    }catch(e){

        alert(
            "Comment save కాలేదు. Supabase comments table check చేయండి."
        );
    }
}

        image.src=url;
        image.style.display="block";
    }

/* ===============================
   UPLOAD
================================ */

async function uploadMedia(file,folder){

    const safe=
        file.name
        .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );

    const path=
        folder+
        "/"+
        Date.now()+
        "_"+
        safe;

    const result=
        await supabaseClient
        .storage
        .from(BUCKET)
        .upload(
            path,
            file,
            {
                upsert:false,
                contentType:file.type
            }
        );

    if(result.error)
        throw result.error;

    const publicUrl=
        supabaseClient
        .storage
        .from(BUCKET)
        .getPublicUrl(path);

    return {
        url:
            publicUrl.data.publicUrl,

        type:
            file.type.startsWith("video/")
            ?"video"
            :"image"
    };
}

/* ===============================
   CREATE NEWS
================================ */

async function createNews(){

    const title=
        document.getElementById(
            "createTitle"
        ).value.trim();

    const body=
        document.getElementById(
            "createBody"
        ).value.trim();

    const category=
        document.getElementById(
            "createCategory"
        ).value;

    const file=
        document.getElementById(
            "newsFile"
        ).files[0];

    const status=
        document.getElementById(
            "createStatus"
        );

    if(!title){

        status.innerText=
            "Headline ఇవ్వండి.";

        return;
    }

    if(!body){

        status.innerText=
            "News details ఇవ్వండి.";

        return;
    }

    status.innerText=
        "Publishing...";

    try{

        let mediaUrl="";
        let mediaType="";

        if(file){

            const uploaded=
                await uploadMedia(
                    file,
                    "news"
                );

            mediaUrl=
                uploaded.url;

            mediaType=
                uploaded.type;
        }

        let payload={

            title:title,

            body:body,

            category:category,

            media_url:mediaUrl,

            media_type:mediaType,

            is_published:true,

            likes:0,

            dislikes:0,

            comments:0,

            created_at:
                new Date().toISOString()
        };

        let result=
            await supabaseClient
            .from("news")
            .insert(payload);

        if(result.error){

            result=
            await supabaseClient
            .from("news")
            .insert({

                title:title,

                body:body,

                category:category,

                image_url:
                    mediaType==="image"
                    ?mediaUrl:null,

                video_url:
                    mediaType==="video"
                    ?mediaUrl:null,

                is_published:true,

                likes:0,
                dislikes:0,
                comments:0,

                created_at:
                    new Date().toISOString()
            });
        }

        if(result.error)
            throw result.error;

        status.innerText=
            "✓ News published successfully";

        document.getElementById(
            "createTitle"
        ).value="";

        document.getElementById(
            "createBody"
        ).value="";

        document.getElementById(
            "newsFile"
        ).value="";

        setTimeout(()=>{

            closeModal(
                "createModal"
            );

            loadNews();

        },700);

    }catch(error){

        console.error(error);

        status.innerText=
            "Publish failed: "+
            (error.message||"Check Supabase");
    }
}

function searchNews(value){

    const box=
        document.getElementById(
            "searchResults"
        );

    const q=
        value.trim().toLowerCase();

    if(!q){

        box.innerHTML="";
        return;
    }

    const results=
        allNews.filter(n=>
            (
                n.title+
                " "+
                n.body+
                " "+
                n.category
            )
            .toLowerCase()
            .includes(q)
        );

    if(!results.length){

        box.innerHTML=
        `<div style="
            text-align:center;
            color:#999;
            padding:20px">
            News not found
        </div>`;

        return;
    }

    box.innerHTML=
    results.slice(0,20)
    .map(n=>`

        <button
            style="
                width:100%;
                text-align:left;
                border:0;
                background:#f6f6f6;
                padding:12px;
                border-radius:10px;
                margin-bottom:7px"
            onclick="jumpToNews('${escapeAttr(n.id)}')">

            <b>
                ${escapeHtml(n.title)}
            </b>

            <div style="
                font-size:10px;
                color:#888;
                margin-top:4px">
                ${escapeHtml(n.category)}
            </div>

        </button>

    `).join("");
}

function jumpToNews(id){

    closeAll();

    const index=
        visibleNews.findIndex(
            n=>String(n.id)===String(id)
        );

    if(index<0){

        currentCategory="All";

        visibleNews=[
            ...allNews
        ];

        renderFeed();

        setTimeout(
            ()=>jumpToNews(id),
            100
        );

        return;
    }

    const cards=
        document.querySelectorAll(
            ".news-card"
        );

    if(cards[index]){

        cards[index].scrollIntoView({
            behavior:"smooth",
            block:"start"
        });
    }
}

function saveNews(index){

    const news=
        visibleNews[index];

    if(!news) return;

    const key=
        "saved_"+news.id;

    const old=
        localStorage.getItem(key);

    localStorage.setItem(
        key,
        old==="yes"?"no":"yes"
    );
}

function openSaved(){

    const saved=
        allNews.filter(n=>
            localStorage.getItem(
                "saved_"+n.id
            )==="yes"
        );

    closeAll();

    if(!saved.length){

        alert(
            "Saved news ఇంకా లేదు."
        );

        return;
    }

    visibleNews=saved;

    renderFeed();
}

/* ===============================
   HELPERS
================================ */

function timeAgo(date){

    const d=new Date(date);

    if(isNaN(d.getTime()))
        return "ఇప్పుడు";

    const mins=
        Math.floor(
            (Date.now()-d.getTime())
            /60000
        );

    if(mins<1)
        return "ఇప్పుడు";

    if(mins<60)
        return mins+" నిమిషాల క్రితం";

    const hours=
        Math.floor(mins/60);

    if(hours<24)
        return hours+" గంటల క్రితం";

    return (
        Math.floor(hours/24)+
        " రోజుల క్రితం"
    );
}

function escapeHtml(value){

    return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttr(value){

    return escapeHtml(value);
}

/* ===============================
   CARD ACTIONS
================================ */

document
.getElementById("feed")
.addEventListener(
    "click",
    function(e){

        const button=
            e.target.closest(
                "[data-action]"
            );

        if(!button)
            return;

        const card=
            button.closest(
                ".news-card"
            );

        if(!card)
            return;

        const index=
            Number(card.dataset.index);

        const action=
            button.dataset.action;

        if(action==="like")
            handleLike(index);

        if(action==="dislike")
            handleDislike(index);

        if(action==="share")
            shareNews(index);

        if(action==="comment")
            openComments(index);

        if(action==="save")
            saveNews(index);
    }
);

/* ===============================
   TOUCH SWIPE
================================ */

let touchStartY=0;

document
.getElementById("feed")
.addEventListener(
    "touchstart",
    e=>{
        touchStartY=
            e.changedTouches[0]
            .screenY;
    },
    {passive:true}
);

document
.getElementById("feed")
.addEventListener(
    "touchend",
    e=>{

        const end=
            e.changedTouches[0]
            .screenY;

        const diff=
            touchStartY-end;

        if(Math.abs(diff)<45)
            return;

        const cards=
            document.querySelectorAll(
                ".news-card"
            );

        if(!cards.length)
            return;

        if(diff>0){

            currentIndex=
                Math.min(
                    currentIndex+1,
                    cards.length-1
                );

        }else{

            currentIndex=
                Math.max(
                    currentIndex-1,
                    0
                );
        }

        cards[currentIndex]
        .scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    },
    {passive:true}
);
