<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>One Minute News</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    background:#fff;
    font-family:Arial,Helvetica,sans-serif;
    color:#111;
}

button,input,textarea,select{
    font-family:inherit;
}

button{
    border:0;
    outline:0;
    cursor:pointer;
}

.app{
    width:100vw;
    height:100dvh;
    max-width:430px;
    margin:0 auto;
    background:#fff;
    position:relative;
    overflow:hidden;
}

/* ================= LOGIN ================= */

.login-screen{
    position:absolute;
    inset:0;
    z-index:1000;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.login-box{
    width:100%;
    max-width:350px;
    text-align:center;
}

.login-logo{
    width:72px;
    height:72px;
    margin:0 auto 18px;
    border-radius:18px;
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:15px;
    font-weight:900;
}

.login-title{
    font-size:27px;
    font-weight:900;
    margin-bottom:7px;
}

.login-sub{
    color:#777;
    font-size:14px;
    margin-bottom:20px;
}

/* NAME INPUT */

.name-wrap{
    height:54px;
    width:100%;
    display:flex;
    align-items:center;
    background:#f7f7f7;
    border:1px solid #ddd;
    border-radius:14px;
    overflow:hidden;
    margin-bottom:10px;
}

.name-wrap input{
    flex:1;
    height:100%;
    border:0;
    outline:0;
    background:transparent;
    padding:0 15px;
    font-size:16px;
}

/* PHONE */

.phone-wrap{
    height:54px;
    width:100%;
    display:flex;
    align-items:center;
    background:#f7f7f7;
    border:1px solid #ddd;
    border-radius:14px;
    overflow:hidden;
}

.phone-prefix{
    height:100%;
    display:flex;
    align-items:center;
    padding:0 13px;
    font-weight:800;
    border-right:1px solid #ddd;
}

.phone-wrap input{
    flex:1;
    height:100%;
    border:0;
    outline:0;
    background:transparent;
    padding:0 13px;
    font-size:17px;
}

.continue-btn{
    width:100%;
    height:54px;
    margin-top:13px;
    border-radius:14px;
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
    color:#fff;
    font-weight:900;
    font-size:16px;
}

.login-error{
    color:#d32f2f;
    font-size:12px;
    min-height:20px;
    margin-top:9px;
}

/* ================= HEADER ================= */

.header{
    height:56px;
    width:100%;
    background:#fff;
    border-bottom:1px solid #eee;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:7px 10px;
    position:absolute;
    top:0;
    left:0;
    z-index:80;
}

.brand{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:16px;
    font-weight:900;
}

.brand-icon{
    padding:5px 7px;
    border-radius:6px;
    color:#fff;
    font-size:9px;
    font-weight:900;
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
}

.header-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#f5f5f5;
    color:#444;
}

/* ================= CATEGORY ================= */

.category-bar{
    position:absolute;
    top:56px;
    left:0;
    width:100%;
    height:42px;
    z-index:75;
    display:flex;
    align-items:center;
    gap:7px;
    padding:5px 9px;
    overflow-x:auto;
    background:#fff;
    border-bottom:1px solid #eee;
    scrollbar-width:none;
}

.category-bar::-webkit-scrollbar{
    display:none;
}

.category{
    flex-shrink:0;
    padding:7px 12px;
    border-radius:18px;
    background:#f2f2f2;
    color:#555;
    font-size:11px;
    font-weight:800;
}

.category.active{
    background:#ff416c;
    color:#fff;
}

/* ================= TICKER ================= */

.ticker{
    position:absolute;
    top:98px;
    left:0;
    width:100%;
    height:29px;
    z-index:74;
    display:flex;
    align-items:center;
    background:#111;
    color:#fff;
    overflow:hidden;
}

.breaking{
    height:100%;
    display:flex;
    align-items:center;
    padding:0 8px;
    background:#e60023;
    font-size:9px;
    font-weight:900;
    flex-shrink:0;
}

.ticker-track{
    white-space:nowrap;
    padding-left:12px;
    font-size:10px;
    animation:ticker 24s linear infinite;
}

@keyframes ticker{
    from{transform:translateX(100%);}
    to{transform:translateX(-100%);}
}

/* ================= FEED ================= */

.feed{
    position:absolute;
    top:127px;
    left:0;
    right:0;
    bottom:0;
    overflow:hidden;
    background:#fff;
    touch-action:pan-y;
}

.feed-track{
    width:100%;
    height:100%;
    transition:transform .32s cubic-bezier(.22,.61,.36,1);
    will-change:transform;
}

/* ================= NEWS CARD ================= */

.news-card{
    width:100%;
    height:100%;
    min-height:100%;
    position:relative;
    display:flex;
    flex-direction:column;
    background:#fff;
    overflow:hidden;
}

/* ================= MEDIA ================= */

.media{
    width:100%;
    height:40%;
    min-height:190px;
    max-height:300px;
    flex-shrink:0;
    position:relative;
    overflow:hidden;
    background:#111;
}

.media img,
.media video{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.media-badge{
    position:absolute;
    top:10px;
    left:10px;
    padding:5px 8px;
    border-radius:5px;
    background:#e60023;
    color:#fff;
    font-size:9px;
    font-weight:900;
}

.category-label{
    position:absolute;
    bottom:9px;
    left:10px;
    padding:5px 9px;
    border-radius:13px;
    background:rgba(0,0,0,.7);
    color:#fff;
    font-size:10px;
    font-weight:700;
}

/* ================= CONTENT ================= */

.news-content{
    flex:1;
    min-height:0;
    overflow:hidden;
    padding:14px 16px 4px;
}

.news-title{
    font-size:21px;
    line-height:1.30;
    font-weight:900;
    margin:0 0 2px 0;
}

.news-body{
    font-size:14px;
    line-height:1.52;
    color:#444;
    white-space:pre-line;
    overflow:hidden;
    margin:0;
}

.news-meta{
    display:flex;
    justify-content:space-between;
    margin-top:7px;
    font-size:10px;
    color:#999;
}

/* ================= ACTIONS ================= */

.card-actions{
    height:57px;
    flex-shrink:0;
    width:100%;
    border-top:1px solid #eee;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-around;
}

.card-action{
    min-width:48px;
    height:48px;
    background:transparent;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:3px;
    color:#666;
    font-size:10px;
    font-weight:700;
}

.card-action i{
    font-size:18px;
}

.card-action.like.active{
    color:#2e7d32;
}

.card-action.dislike.active{
    color:#d32f2f;
}

.card-action.save.active{
    color:#ff416c;
}

.whatsapp-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#25D366;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}

/* ================= LOADING ================= */

.loading{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#888;
    font-size:13px;
}

/* ================= ERROR ================= */

.db-error{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25px;
}

.db-error-box{
    width:100%;
    max-width:320px;
}

.db-error-title{
    font-size:17px;
    font-weight:900;
    margin-bottom:8px;
}

.db-error-text{
    color:#888;
    font-size:11px;
    line-height:1.5;
    word-break:break-word;
    margin-bottom:14px;
}

/* ================= OVERLAY ================= */

.overlay{
    position:absolute;
    inset:0;
    z-index:150;
    background:rgba(0,0,0,.45);
    display:none;
}

.overlay.show{
    display:block;
}

/* ================= SIDE MENU ================= */

.side-menu{
    position:absolute;
    top:0;
    right:-88%;
    width:84%;
    height:100%;
    background:#fff;
    z-index:200;
    transition:.28s ease;
    box-shadow:-10px 0 35px rgba(0,0,0,.2);
}

.side-menu.open{
    right:0;
}

.menu-head{
    padding:18px 15px;
    border-bottom:1px solid #eee;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.menu-user{
    font-weight:900;
}

.menu-phone{
    color:#888;
    font-size:12px;
    margin-top:3px;
}

.close{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#f2f2f2;
}

.menu-list{
    padding:10px;
}

.menu-item{
    width:100%;
    min-height:50px;
    background:#fff;
    display:flex;
    align-items:center;
    gap:13px;
    padding:12px;
    border-radius:11px;
    text-align:left;
    font-weight:700;
}

.menu-item i{
    width:24px;
    color:#ff416c;
}

/* ================= MODAL ================= */

.modal{
    position:absolute;
    left:0;
    right:0;
    bottom:-100%;
    max-height:88%;
    background:#fff;
    z-index:300;
    border-radius:20px 20px 0 0;
    padding:16px;
    transition:.3s ease;
    overflow-y:auto;
}

.modal.open{
    bottom:0;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:17px;
    font-weight:900;
    margin-bottom:15px;
}

.form-group{
    margin-bottom:12px;
}

.form-group label{
    display:block;
    margin-bottom:5px;
    color:#555;
    font-size:11px;
    font-weight:800;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    border:1px solid #ddd;
    background:#fafafa;
    border-radius:10px;
    padding:11px;
    outline:none;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.file-box{
    padding:11px;
    border:1px dashed #ccc;
    border-radius:10px;
    background:#fafafa;
}

.preview{
    display:none;
    width:100%;
    max-height:170px;
    object-fit:cover;
    margin-top:8px;
    border-radius:9px;
}

.primary{
    width:100%;
    height:48px;
    border-radius:11px;
    background:linear-gradient(135deg,#ff416c,#ff4b2b);
    color:#fff;
    font-weight:900;
}

.primary:disabled{
    opacity:.6;
}

.status{
    min-height:18px;
    text-align:center;
    font-size:11px;
    margin:7px 0;
}

/* ================= COMMENTS ================= */

.comments-list{
    max-height:330px;
    overflow:auto;
    margin-bottom:10px;
}

.comment{
    background:#f5f5f5;
    padding:10px;
    border-radius:9px;
    margin-bottom:7px;
    font-size:13px;
}

.comment b{
    display:block;
    margin-bottom:3px;
}

.comment-form{
    display:flex;
    gap:7px;
}

.comment-form input{
    flex:1;
    border:1px solid #ddd;
    border-radius:22px;
    padding:10px 13px;
    outline:none;
}

.comment-form button{
    border-radius:22px;
    padding:0 15px;
    background:#ff416c;
    color:#fff;
    font-weight:800;
}

.empty{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#777;
    padding:25px;
}

.saved-item{
    width:100%;
    text-align:left;
    border:0;
    background:#f6f6f6;
    padding:12px;
    border-radius:10px;
    margin-bottom:7px;
}

@media(max-height:650px){

    .media{
        height:37%;
        min-height:165px;
    }

    .news-content{
        padding-top:11px;
    }

    .news-title{
        font-size:18px;
        margin-bottom:2px;
    }

    .news-body{
        font-size:13px;
        line-height:1.48;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- LOGIN -->

<div class="login-screen" id="loginScreen">

    <div class="login-box">

        <div class="login-logo">
            1 MIN
        </div>

        <div class="login-title">
            One Minute News
        </div>

        <div class="login-sub">
            మీ పేరు & మొబైల్ నంబర్ నమోదు చేసి కొనసాగండి
        </div>

        <!-- NAME -->

        <div class="name-wrap">

            <input
                id="nameInput"
                type="text"
                maxlength="40"
                placeholder="మీ పేరు"
                autocomplete="name">

        </div>

        <!-- PHONE -->

        <div class="phone-wrap">

            <div class="phone-prefix">
                +91
            </div>

            <input
                id="phoneInput"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                placeholder="10 digit mobile number"
                oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)">

        </div>

        <button
            class="continue-btn"
            onclick="mobileLogin()">
            Continue
        </button>

        <div
            class="login-error"
            id="loginError">
        </div>

    </div>

</div>

<!-- HEADER -->

<header class="header">

    <div class="brand">

        <span class="brand-icon">
            1 MIN
        </span>

        <span>
            One Minute News
        </span>

    </div>

    <div class="header-actions">

        <button
            class="icon-btn"
            onclick="openSearch()">

            <i class="fa-solid fa-magnifying-glass"></i>

        </button>

        <button
            class="icon-btn"
            onclick="loadNews()">

            <i class="fa-solid fa-arrows-rotate"></i>

        </button>

        <button
            class="icon-btn"
            onclick="openMenu()">

            <i class="fa-solid fa-bars"></i>

        </button>

    </div>

</header>

<!-- CATEGORY -->

<div class="category-bar">

    <button class="category active"
        onclick="filterCategory('All',this)">
        అన్ని
    </button>

    <button class="category"
        onclick="filterCategory('Business',this)">
        బిజినెస్
    </button>

    <button class="category"
        onclick="filterCategory('Sports',this)">
        స్పోర్ట్స్
    </button>

    <button class="category"
        onclick="filterCategory('Cinema',this)">
        సినిమా
    </button>

    <button class="category"
        onclick="filterCategory('Tech',this)">
        టెక్
    </button>

    <button class="category"
        onclick="filterCategory('Politics',this)">
        పాలిటిక్స్
    </button>

    <button class="category"
        onclick="filterCategory('Local',this)">
        లోకల్
    </button>

</div>

<!-- TICKER -->

<div class="ticker">

    <div class="breaking">
        BREAKING
    </div>

    <div
        class="ticker-track"
        id="tickerText">
        తాజా వార్తలు One Minute Newsలో...
    </div>

</div>

<!-- FEED -->

<main
    class="feed"
    id="feed">

    <div class="loading">
        Login చేసి వార్తలు చూడండి...
    </div>

</main>

<!-- OVERLAY -->

<div
    class="overlay"
    id="overlay"
    onclick="closeAll()">
</div>

<!-- SIDE MENU -->

<div
    class="side-menu"
    id="sideMenu">

    <div class="menu-head">

        <div>

            <div
                class="menu-user"
                id="menuUser">
                One Minute Reader
            </div>

            <div
                class="menu-phone"
                id="menuPhone">
            </div>

        </div>

        <button
            class="close"
            onclick="closeAll()">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>

    <div class="menu-list">

        <button
            class="menu-item"
            onclick="openCreateNews()">

            <i class="fa-solid fa-pen-to-square"></i>

            <span>
                Create News
            </span>

        </button>

        <button
            class="menu-item"
            onclick="openSuggestion()">

            <i class="fa-regular fa-lightbulb"></i>

            <span>
                Send Suggestion
            </span>

        </button>

        <button
            class="menu-item"
            onclick="openSearch()">

            <i class="fa-solid fa-magnifying-glass"></i>

            <span>
                Search News
            </span>

        </button>

        <button
            class="menu-item"
            onclick="openSaved()">

            <i class="fa-regular fa-bookmark"></i>

            <span>
                Saved News
            </span>

        </button>

        <button
            class="menu-item"
            onclick="loadNews();closeAll()">

            <i class="fa-solid fa-rotate"></i>

            <span>
                Refresh News
            </span>

        </button>

        <button
            class="menu-item"
            onclick="logout()">

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>
                Change Mobile Number
            </span>

        </button>

    </div>

</div>

<!-- CREATE NEWS -->

<div
    class="modal"
    id="createModal">

    <div class="modal-head">

        <span>
            Create News
        </span>

        <button
            class="close"
            onclick="closeModal('createModal')">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>

    <div class="form-group">

        <label>
            Category
        </label>

        <select id="createCategory">

            <option>Local</option>
            <option>Business</option>
            <option>Sports</option>
            <option>Cinema</option>
            <option>Tech</option>
            <option>Politics</option>
            <option>News</option>

        </select>

    </div>

    <div class="form-group">

        <label>
            Headline
        </label>

        <input
            id="createTitle"
            placeholder="వార్త headline">

    </div>

    <div class="form-group">

        <label>
            News Details
        </label>

        <textarea
            id="createBody"
            placeholder="వార్త పూర్తి వివరాలు రాయండి..."></textarea>

    </div>

    <div class="form-group">

        <label>
            Photo / Video
        </label>

        <div class="file-box">

            <input
                id="newsFile"
                type="file"
                accept="image/*,video/*"
                onchange="previewNewsFile()">

            <img
                id="newsPreviewImage"
                class="preview">

            <video
                id="newsPreviewVideo"
                class="preview"
                controls>
            </video>

        </div>

    </div>

    <div
        class="status"
        id="createStatus">
    </div>

    <button
        class="primary"
        id="publishButton"
        onclick="createNews()">

        <i class="fa-solid fa-cloud-arrow-up"></i>

        Publish News

    </button>

</div>

<!-- SUGGESTION -->

<div
    class="modal"
    id="suggestionModal">

    <div class="modal-head">

        <span>
            Send Suggestion
        </span>

        <button
            class="close"
            onclick="closeModal('suggestionModal')">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>

    <div class="form-group">

        <label>
            Suggestion
        </label>

        <textarea
            id="suggestionText"
            placeholder="మీ suggestion లేదా వార్త ఇక్కడ రాయండి..."></textarea>

    </div>

    <div class="form-group">

        <label>
            Optional Photo / Video
        </label>

        <div class="file-box">

            <input
                id="suggestionFile"
                type="file"
                accept="image/*,video/*">

        </div>

    </div>

    <div
        class="status"
        id="suggestionStatus">
    </div>

    <button
        class="primary"
        onclick="submitSuggestion()">

        <i class="fa-solid fa-paper-plane"></i>

        Send Suggestion

    </button>

</div>

<!-- COMMENTS -->

<div
    class="modal"
    id="commentsModal">

    <div class="modal-head">

        <span>
            Comments
            (<span id="modalCommentCount">0</span>)
        </span>

        <button
            class="close"
            onclick="closeModal('commentsModal')">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>

    <div
        class="comments-list"
        id="commentsList">
    </div>

/* =========================================================
   NORMALIZE
========================================================= */

function normalizeNews(row,index){

    row = row || {};

    let id =
        row.id ??
        row.news_id;

    if(
        id === null ||
        id === undefined
    ){

        id =
            "local_" +
            index +
            "_" +
            Date.now();

    }

    return {

        id:String(id),

        title:
            row.title ??
            row.headline ??
            row.news_title ??
            "తాజా వార్త",

        body:
            row.body ??
            row.content ??
            row.description ??
            row.text ??
            row.news_body ??
            row.article ??
            "",

        image:
            row.image_url ??
            row.image ??
            row.image_src ??
            row.thumbnail ??
            row.photo_url ??
            "",

        video:
            row.video_url ??
            row.video ??
            row.video_src ??
            "",

        media:
            row.media_url ??
            "",

        mediaType:
            row.media_type ??
            row.mediaType ??
            "",

        category:
            row.category ??
            row.section ??
            row.type_category ??
            "News",

        likes:
            Number(
                row.likes ??
                row.like_count ??
                row.likes_count ??
                0
            ) || 0,

        dislikes:
            Number(
                row.dislikes ??
                row.dislike_count ??
                row.dislikes_count ??
                0
            ) || 0,

        comments:
            Number(
                row.comments ??
                row.comment_count ??
                row.comments_count ??
                0
            ) || 0,

        created:
            row.created_at ??
            row.published_at ??
            row.date ??
            new Date().toISOString()

    };

}

/* =========================================================
   ERROR
========================================================= */

function getErrorMessage(error){

    if(!error)

    return (
        error.message ||
        error.details ||

}

/* =========================================================
   FILTER
========================================================= */

function filterCategory(

    )

        visibleNews =

   RENDER FEED

                    }"

                        }

}

/* =========================================================
   MEDIA
========================================================= */

function getMediaHtml(news){

    let url = "";
    let type = "";

    if(news.video){

        url = news.video;
        type = "video";

    }else if(news.image){

        url = news.image;
        type = "image";

    }else if(news.media){

        url = news.media;
        type =
            news.mediaType ||
            detectMediaType(url);

    }

    if(!url){

        return `

            <div style="
                width:100%;
                height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
                color:#aaa;
                font-size:50px">

                <i class="fa-regular fa-newspaper"></i>

            </div>

        `;

    }

    if(
        type === "video" ||
        isVideo(url)
    ){

        return `

            <video
                src="${escapeAttr(url)}"
                playsinline
                muted
                controls
                preload="metadata">
            </video>

        `;

    }

    return `

        <img
            src="${escapeAttr(url)}"
            alt="News"
            loading="lazy"
            onerror="this.style.display='none'">

    `;

}

function isVideo(url){

    return /\.(mp4|webm|ogg|mov|m4v)(\?|$)/i
        .test(
            String(url || "")
        );

}

function detectMediaType(url){

    return isVideo(url)
        ? "video"
        : "image";

}

/* =========================================================
   PAGE-BY-PAGE POSITION
========================================================= */

function updateFeedPosition(
    animate = true
){

    const track =
        document.getElementById(
            "feedTrack"
        );

    if(!track)
        return;

    track.style.transition =
        animate
        ? "transform .32s cubic-bezier(.22,.61,.36,1)"
        : "none";

    track.style.transform =
        "translate3d(0,-" +
        (
            currentIndex * 100
        ) +
        "%,0)";

    currentNews =
        visibleNews[
            currentIndex
        ] || null;

    setTimeout(
        playCurrentVideo,
        animate ? 320 : 0
    );

}

/* =========================================================
   GO TO NEXT/PREVIOUS
========================================================= */

function goToNews(index){

    if(!visibleNews.length)
        return;

    if(index < 0)
        index = 0;

    if(index >= visibleNews.length)
        index = visibleNews.length - 1;

    if(index === currentIndex){

        updateFeedPosition(false);
        return;

    }

    currentIndex =
        index;

    updateFeedPosition(true);

}

/* =========================================================
   VIDEO
========================================================= */

function playCurrentVideo(){

    document
    .querySelectorAll(
        ".media video"
    )
    .forEach(
        function(video){

            try{
                video.pause();
            }catch(e){}

        }
    );

    const card =
        document.querySelector(
            '.news-card[data-index="' +
            currentIndex +
            '"]'
        );

    if(!card)
        return;

    const video =
        card.querySelector(
            ".media video"
        );

    if(video){

        video.muted = true;

        const promise =
            video.play();

        if(
            promise &&
            promise.catch
        ){

            promise.catch(
                function(){}
            );

        }

    }

}

/* =========================================================
   LIKE
========================================================= */

async function handleLike(index){

    const news =
        visibleNews[index];

    if(!news)
        return;

    const key =
        "reaction_" + news.id;

    const old =
        localStorage.getItem(key);

    if(old === "like"){

        news.likes =
            Math.max(
                0,
                news.likes - 1
            );

        localStorage.removeItem(key);

    }else{

        if(old === "dislike"){

            news.dislikes =
                Math.max(
                    0,
                    news.dislikes - 1
                );

        }

        news.likes++;

        localStorage.setItem(
            key,
            "like"
        );

    }

    const keepIndex =
        currentIndex;

    renderFeed();

    currentIndex =
        Math.min(
            keepIndex,
            visibleNews.length - 1
        );

    updateFeedPosition(false);

    updateReaction(news);

}

/* =========================================================
   DISLIKE
========================================================= */

async function handleDislike(index){

    const news =
        visibleNews[index];

    if(!news)
        return;

    const key =
        "reaction_" + news.id;

    const old =
        localStorage.getItem(key);

    if(old === "dislike"){

        news.dislikes =
            Math.max(
                0,
                news.dislikes - 1
            );

        localStorage.removeItem(key);

    }else{

        if(old === "like"){

            news.likes =
                Math.max(
                    0,
                    news.likes - 1
                );

        }

        news.dislikes++;

        localStorage.setItem(
            key,
            "dislike"
        );

    }

    const keepIndex =
        currentIndex;

    renderFeed();

    currentIndex =
        Math.min(
            keepIndex,
            visibleNews.length - 1
        );

    updateFeedPosition(false);

    updateReaction(news);

}

/* =========================================================
   UPDATE REACTION
========================================================= */

async function updateReaction(news){

    if(
        !supabaseClient ||
        !news ||
        !news.id
    )
        return;

    try{

        const result =
            await supabaseClient
            .from("news")
            .update({

                likes:
                    Number(
                        news.likes || 0
                    ),

                dislikes:
                    Number(
                        news.dislikes || 0
                    )

            })
            .eq(
                "id",
                news.id
            );

        if(result.error){

            console.warn(
                "Reaction update:",
                result.error
            );

        }

    }catch(error){

        console.error(
            error
        );

    }

}

/* =========================================================
   WHATSAPP SHARE
   HEADLINE + DIRECT NEWS LINK ONLY
========================================================= */

function shareNews(index){

    const news =
        visibleNews[index];

    if(!news)
        return;

    /*
      GitHub Pages compatible:
      current website URL + ?news=UUID
    */

    const url =
        window.location.origin +
        window.location.pathname +
        "?news=" +
        encodeURIComponent(
            news.id
        );

    const text =
        "📰 " +
        news.title +
        "\n\n" +
        "Read on One Minute News 👇\n" +
        url;

    const whatsappUrl =
        "https://wa.me/?text=" +
        encodeURIComponent(
            text
        );

    window.open(
        whatsappUrl,
        "_blank"
    );

}

/* =========================================================
   OPEN SHARED NEWS FROM URL
========================================================= */

function openSharedNewsFromUrl(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    const sharedId =
        params.get("news");

    if(
        !sharedId ||
        !allNews.length
    ){

        return;

    }

    currentCategory =
        "All";

    document
    .querySelectorAll(
        ".category"
    )
    .forEach(
        function(item,index){

            item.classList.toggle(
                "active",
                index === 0
            );

        }
    );

    visibleNews =
        [...allNews];

    currentIndex = 0;

    renderFeed();

    const index =
        visibleNews.findIndex(
            function(news){

                return String(news.id) ===
                    String(sharedId);

            }
        );

    if(index >= 0){

        setTimeout(
            function(){

                goToNews(index);

            },
            80
        );

    }

}

/* =========================================================
   COMMENTS OPEN
========================================================= */

async function openComments(index){

    if(!currentNews)

    setTimeout(
        function(){

            ).focus();

    );

}

   LOAD COMMENTS
========================================================= */

            </div>`;

        return;
    }

    list.innerHTML =
        `<div style="text-align:center;color:#999;padding:25px">
            Loading...
        </div>`;

    try{

        let result =
            await supabaseClient
            .from("comments")
            .select("*")
            .eq(
                "news_id",
                currentNews.id
            )
            .order(
                "created_at",
                {
                    ascending:true
                }
            );

        if(result.error){

            result =
                await supabaseClient
                .from("comments")
                .select("*")
                .eq(
                    "news_id",
                    currentNews.id
                );

        }

        if(result.error)
            throw result.error;

        const rows =
            Array.isArray(result.data)

            return;

                        <div class="comment">

                            <b>

                                    comment.user_name ||

                                comment.comment ||
                                comment.text ||
                                comment.content ||
                                ""
                            )}

                        </div>

                    `;

                }
            ).join("");

        list.scrollTop =
            list.scrollHeight;

    }catch(error){

        console.error(
            "COMMENTS ERROR:",
            error
        );

        list.innerHTML =

        );

    }

    const button =
        document.querySelector(

        );

    button.disabled = true;
    button.innerText = "Sending...";

    try{

        const phone =
            localStorage.getItem(
                "oneMinuteMobile"
            );

            localStorage.getItem(

            ) || "Reader";

        /*
          news_id = UUID
        */

        let result =

        */

                .insert({

                    news_id:
                        currentNews.id,

                    name:
                        name,

                    comment:
                        text,

                    created_at:
                        new Date().toISOString()

                });

        }

        /*
          If name column doesn't exist
        */

        if(result.error){

            result =
                await supabaseClient
                .from("comments")
                .insert({

                    news_id:
                        currentNews.id,

                    comment:
                        text

                });

        }

        if(result.error)
            throw result.error;

        input.value = "";

        currentNews.comments =

                currentNews.comments || 0
            ) + 1;

        await loadComments();

        const card =
            document.querySelector(
                '.news-card[data-index="' +
                currentIndex +
                '"]'
            );

        if(card){

            const span =
                card.querySelector(
                    '[data-action="comment"] span'
                );

            if(span){

                    currentNews.comments;

            }

        }

    }catch(error){

            "ADD COMMENT ERROR:",
            error

            "Comment save కాలేదు:\n" +
            getErrorMessage(error)
        );

    }finally{

        button.disabled = false;
        button.innerText = "పంపు";

}

/* =========================================================
   SAVE
========================================================= */

function saveNews(index){

    const news =
        visibleNews[index];

    if(!news)
        return;

    const key =
        "saved_" + news.id;

    const old =
        localStorage.getItem(key)
        === "yes";

    if(old){

        localStorage.removeItem(key);

    }else{

        localStorage.setItem(
            key,
            "yes"
        );

    }

    const card =
        document.querySelector(
            '.news-card[data-index="' +
            index +
            '"]'
        );

    if(!card)
        return;

    const button =
        card.querySelector(
            '[data-action="save"]'
        );

    if(!button)
        return;

    const nowSaved =
        !old;

    button.classList.toggle(
        "active",
        nowSaved
    );

    const icon =
        button.querySelector("i");

    const span =
        button.querySelector("span");

    if(icon){

        icon.className =
            nowSaved
            ? "fa-solid fa-bookmark"
            : "fa-regular fa-bookmark";

    }

    if(span){

        span.innerText =
            nowSaved
            ? "Saved"
            : "Save";

    }

}

/* =========================================================
   UPLOAD MEDIA
========================================================= */

async function uploadMedia(
    file,
    folder
){

    if(!supabaseClient)
        throw new Error(
            "Supabase unavailable"
        );

    if(!file)
        throw new Error(
            "File missing"
        );

    const safeName =
        file.name.replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );

    const path =
        folder +
        "/" +
        Date.now() +
        "_" +
        Math.random()
        .toString(36)
        .slice(2,8) +
        "_" +
        safeName;

    const result =
        await supabaseClient
        .storage
        .from(BUCKET)
        .upload(
            path,
            file,
            {
                upsert:false,
                contentType:
                    file.type ||
                    "application/octet-stream"
            }
        );

    if(result.error)
        throw result.error;

    const publicResult =
        supabaseClient
        .storage
        .from(BUCKET)
        .getPublicUrl(path);

    return {

        url:
            publicResult.data.publicUrl,

        type:
            file.type.startsWith("video/")
            ? "video"
            : "image"

    };

}

/* =========================================================
   CREATE NEWS
========================================================= */

async function createNews(){

    const title =
        document.getElementById(
            "createTitle"
        ).value.trim();

    const body =
        document.getElementById(
            "createBody"
        ).value.trim();

    const category =
        document.getElementById(
            "createCategory"
        ).value;

    const file =
        document.getElementById(
            "newsFile"
        ).files[0];

    const status =
        document.getElementById(
            "createStatus"
        );

    const button =
        document.getElementById(
            "publishButton"
        );

    if(!title){

        status.innerText =
            "Headline ఇవ్వండి.";

        return;
    }

    if(!body){

        status.innerText =
            "News details ఇవ్వండి.";

        return;
    }

    if(!supabaseClient){

        status.innerText =
            "Supabase connection unavailable.";

        return;
    }

    button.disabled = true;
    status.innerText = "Publishing...";

    try{

        let mediaUrl = "";
        let mediaType = "";

        if(file){

            const uploaded =
                await uploadMedia(
                    file,
                    "news"
                );

            mediaUrl =
                uploaded.url;

            mediaType =
                uploaded.type;

        }

        const now =
            new Date().toISOString();

        let result =
            await supabaseClient
            .from("news")
            .insert({

                title:title,
                body:body,
                category:category,

                media_url:
                    mediaUrl || null,

                media_type:
                    mediaType || null,

                is_published:true,

                likes:0,
                dislikes:0,
                comments:0,

                created_at:now

            });

        if(result.error){

            result =
                await supabaseClient
                .from("news")
                .insert({

                    title:title,
                    body:body,
                    category:category,

                    image_url:
                        mediaType === "image"
                        ? mediaUrl
                        : null,

                    video_url:
                        mediaType === "video"
                        ? mediaUrl
                        : null,

                    is_published:true,

                    likes:0,
                    dislikes:0,
                    comments:0,

                    created_at:now

                });

        }

        if(result.error){

            result =
                await supabaseClient
                .from("news")
                .insert({

                    title:title,
                    body:body,
                    category:category,
                    is_published:true

                });

        }

        if(result.error)
            throw result.error;

        status.innerText =
            "✓ News published successfully";

        document.getElementById(
            "createTitle"
        ).value = "";

        document.getElementById(
            "createBody"
        ).value = "";

        document.getElementById(
            "newsFile"
        ).value = "";

        document.getElementById(
            "newsPreviewImage"
        ).style.display = "none";

        document.getElementById(
            "newsPreviewVideo"
        ).style.display = "none";

        setTimeout(
            function(){

                closeModal(
                    "createModal"
                );

                loadNews();

            },
            800
        );

    }catch(error){

        console.error(
            "CREATE NEWS:",
            error
        );

        status.innerText =
            "Publish failed: " +
            getErrorMessage(error);

    }finally{

        button.disabled = false;

    }

}

function searchNews(value){

    const box =
        document.getElementById(
            "searchResults"
        );

    const q =
        String(
            value || ""
        )
        .trim()
        .toLowerCase();

    if(!q){

        box.innerHTML = "";
        return;

    }

    const results =
        allNews.filter(
            function(news){

                return (
                    String(news.title || "") +
                    " " +
                    String(news.body || "") +
                    " " +
                    String(news.category || "")
                )
                .toLowerCase()
                .includes(q);

            }
        );

    if(!results.length){

        box.innerHTML =
            `<div style="text-align:center;color:#999;padding:20px">
                News not found
            </div>`;

        return;

    }

    box.innerHTML =
        results
        .slice(0,20)
        .map(
            function(news){

                return `

                    <button
                        class="saved-item"
                        data-news-id="${escapeAttr(news.id)}">

                        <b>
                            ${escapeHtml(
                                news.title
                            )}
                        </b>

                        <div style="
                            font-size:10px;
                            color:#888;
                            margin-top:4px">

                            ${escapeHtml(
                                news.category
                            )}

                        </div>

                    </button>

                `;

            }
        )
        .join("");

}

/* =========================================================
   TIME
========================================================= */

function timeAgo(date){

    const d =
        new Date(date);

    if(isNaN(d.getTime()))
        return "ఇప్పుడు";

    const mins =
        Math.floor(
            (
                Date.now() -
                d.getTime()
            ) / 60000
        );

    if(mins < 1)
        return "ఇప్పుడు";

    if(mins < 60)
        return mins +
            " నిమిషాల క్రితం";

    const hours =
        Math.floor(
            mins / 60
        );

    if(hours < 24)
        return hours +
            " గంటల క్రితం";

    return Math.floor(
        hours / 24
    ) + " రోజుల క్రితం";

}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeAttr(value){

    return escapeHtml(value);

}

/* =========================================================
   TOUCH SWIPE
========================================================= */

document
.getElementById("feed")
.addEventListener(
    "touchstart",
    function(event){

        const target =
            event.target;

        if(
            target.closest(
                "button,input,textarea,select,video"
            )
        ){

            touchTracking = false;
            return;

        }

        touchTracking = true;

        touchStartY =
            event.changedTouches[0].screenY;

        touchStartX =
            event.changedTouches[0].screenX;

    },
    {
        passive:true
    }
);

document
.getElementById("feed")
.addEventListener(
    "touchend",
    function(event){

        if(!touchTracking)
            return;

        const endY =
            event.changedTouches[0].screenY;

        const endX =
            event.changedTouches[0].screenX;

        const diffY =
            touchStartY - endY;

        const diffX =
            touchStartX - endX;

        touchTracking = false;

        if(
            Math.abs(diffY) < 50 ||
            Math.abs(diffY) <= Math.abs(diffX)
        ){

            return;

        }

        /*
          EXACTLY ONE NEWS PER SWIPE
        */

        if(diffY > 0){

            goToNews(
                currentIndex + 1
            );

        }else{

            goToNews(
                currentIndex - 1
            );

        }

    },
    {
        passive:true
    }
);
